        input, textarea, select {

        }

        @media (min-width: 640px) {
            body {

            display: none;

            scrollbar-width: none;
        }
        @keyframes slideUp {
            from { transform: translate3d(0, 100%, 0); }
            to   { transform: translate3d(0, 0, 0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }
        @keyframes popIn {
            0%   { transform: scale(0.5); opacity: 0; }
            70%  { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        /* iOS-native bottom sheet — no persistent animation class after open */
        .sheet-panel {
            backface-visibility: hidden;
            will-change: transform;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.10);
            /* default: spring transition for snap-back and expand/collapse */

        // 初始化/解鎖音效引擎 (必須在使用者點擊時呼叫)
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
            try {
                // 確保 Context 存在
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                
                if (!audioCtx) return;

                // 再次嘗試恢復 (以防萬一)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 聲音包絡線 (避免爆音)
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

            if (diffDays === 1) return '昨天';

        function RadarChart({ data, onChange }) {
            const cx = 100, cy = 100, maxR = 68;
            const svgRef = useRef(null);
            const draggingRef = useRef(null);

            const axes = [
                { key: 'acidity',    label: '酸感', angle: -Math.PI / 2 },
                { key: 'sweetness',  label: '甜感', angle: 0 },
                { key: 'bitterness', label: '苦味', angle: Math.PI / 2 },
                { key: 'body',       label: '醇厚', angle: Math.PI },
            ];

            const pt = (angle, r) => ({
                x: +(cx + r * Math.cos(angle)).toFixed(1),
                y: +(cy + r * Math.sin(angle)).toFixed(1),
            });

            const gridPath = (r) => {
                const pts = axes.map(a => pt(a.angle, r));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            };

            const dataPath = (() => {
                const pts = axes.map(a => pt(a.angle, (data[a.key] / 5) * maxR));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            })();

            const getSvgXY = (e) => {
                const svg = svgRef.current;
                if (!svg) return null;
                const rect = svg.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return {
                    x: ((src.clientX - rect.left) / rect.width) * 244 - 22,
                    y: ((src.clientY - rect.top) / rect.height) * 232 - 16,
                };
            };

            const nearestAxis = (dx, dy) => {
                const angle = Math.atan2(dy, dx);
                let best = axes[0], minD = Infinity;
                axes.forEach(a => {
                    let d = Math.abs(angle - a.angle);
                    if (d > Math.PI) d = 2 * Math.PI - d;
                    if (d < minD) { minD = d; best = a; }
                });
                return best;
            };

            const projValue = (dx, dy, axis) => {
                const proj = dx * Math.cos(axis.angle) + dy * Math.sin(axis.angle);
                return Math.max(1, Math.min(5, Math.round((proj / maxR) * 5)));
            };

            const onDown = (e) => {
                if (!onChange) return;
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                const axis = nearestAxis(dx, dy);
                draggingRef.current = axis;
                onChange(axis.key, projValue(dx, dy, axis));
            };

            const onMove = (e) => {
                if (!onChange || !draggingRef.current) return;
                e.preventDefault();
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                onChange(draggingRef.current.key, projValue(dx, dy, draggingRef.current));
            };

            const onUp = () => { draggingRef.current = null; };

            return (
                <svg
                    ref={svgRef}
                    viewBox="-22 -16 244 232"
                    style={{ width: '100%', maxWidth: '240px', display: 'block', margin: '0 auto',
                             touchAction: onChange ? 'none' : 'auto', cursor: onChange ? 'crosshair' : 'default' }}
                    onPointerDown={onChange ? onDown : undefined}
                    onPointerMove={onChange ? onMove : undefined}
                    onPointerUp={onChange ? onUp : undefined}
                    onPointerLeave={onChange ? onUp : undefined}
                >
                    {[1,2,3,4,5].map(l => (
                        <path key={l} d={gridPath((l/5)*maxR)} fill="none" stroke={l===5?"#d1d5db":"#e5e7eb"} strokeWidth={l===5?1.5:1} />
                    ))}
                    {axes.map(a => {
                        const end = pt(a.angle, maxR);
                        return <line key={a.key} x1={cx} y1={cy} x2={end.x} y2={end.y} stroke="#d1d5db" strokeWidth="1" />;
                    })}
                    <path d={dataPath} fill="rgba(217,119,6,0.18)" stroke="#d97706" strokeWidth="2" strokeLinejoin="round" />
                    {axes.map(a => {
                        const p = pt(a.angle, (data[a.key] / 5) * maxR);
                        return <circle key={a.key} cx={p.x} cy={p.y} r="5" fill="#d97706" stroke="white" strokeWidth="2" style={{ pointerEvents: 'none' }} />;
                    })}
                    {axes.map(a => {
                        const lp = pt(a.angle, maxR + 20);
                        return (
                            <text key={a.key} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" style={{ pointerEvents: 'none', userSelect: 'none' }}>
                                <tspan fontSize="13" fill="#78716c" fontWeight="bold">{a.label} </tspan>
                                <tspan fontSize="13" fill="#d97706" fontWeight="bold">{data[a.key]}</tspan>
                            </text>
                        );
                    })}
                </svg>
            );
        }

            const [logs, setLogs] = useState(() => {
                try {

                } catch (e) {

            });

            const [editingLogId, setEditingLogId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('newest');
            const [viewMode, setViewMode] = useState('timeline'); // 'timeline' | 'byBean'
            const [beanDrilldown, setBeanDrilldown] = useState(null); // bean name when drilled from byBean

            const springBack = () => {
                const el = activeSheetRef.current;
                if (!el) return;
                // Re-enable the CSS spring transition, then reset transform
                el.classList.remove('sheet-dragging');
                el.style.transform = '';
            };

            const closeBottomSheet = (name, setOpen) => {
                sheetDragStartY.current = null;
                sheetDragMeta.current = null;
                sheetOpenedRef.current = false;
                setClosingSheet(name);
                setSheetIsExpanded(false);
                if (activeSheetRef.current) {
                    activeSheetRef.current.classList.remove('sheet-dragging', 'sheet-opening');
                    activeSheetRef.current.style.transform = '';
                }
                // Wait for .sheet-exit (0.32s) to finish
                setTimeout(() => { setOpen(false); setClosingSheet(null); }, 340);
            };
            const onSheetTouchStart = (e, name, setOpen) => {
                const y = e.touches[0].clientY;
                sheetDragStartY.current = y;
                sheetLastTouch.current = { y, time: Date.now() };
                sheetDragMeta.current = { name, setOpen };
                const el = activeSheetRef.current;
                if (el) {
                    // Kill ALL transitions — finger must win immediately
                    el.classList.add('sheet-dragging');
                    el.classList.remove('sheet-opening');
                }
            };
            const onSheetTouchMove = (e) => {
                if (sheetDragStartY.current === null) return;
                const touch = e.touches[0];
                const y = touch.clientY;
                sheetLastTouch.current = { y, time: Date.now() };

                let delta = y - sheetDragStartY.current;

                // Rubber-band upward: logarithmic resistance
                if (delta < 0) {
                    const d = Math.abs(delta);
                    delta = -(d * 0.4 / (1 + d / 200));
                }

                const el = activeSheetRef.current;
                if (el) el.style.transform = `translate3d(0,${delta}px,0)`;
            };
            const onSheetTouchEnd = (e) => {
                if (sheetDragStartY.current === null) return;
                const y = e.changedTouches[0].clientY;
                const now = Date.now();
                const delta = y - sheetDragStartY.current;

                const dt = now - sheetLastTouch.current.time;
                const dy = y - sheetLastTouch.current.y;
                // px/ms velocity — only trust if sample is recent
                const velocity = (dt > 0 && dt < 80) ? (dy / dt) : 0;

                const { name, setOpen } = sheetDragMeta.current || {};
                sheetDragStartY.current = null;

                if (!name) { springBack(); return; }

                // Momentum-projected landing
                const projected = delta + velocity * 120;

                if (sheetIsExpanded) {
                    if (projected > 180 || velocity > 1.0) {
                        closeBottomSheet(name, setOpen);
                    } else {
                        if (projected > 70 || velocity > 0.4) setSheetIsExpanded(false);
                        springBack();
                    }
                } else {
                    if (projected > 90 || velocity > 0.7) {
                        closeBottomSheet(name, setOpen);
                    } else {
                        if (projected < -50 || velocity < -0.5) setSheetIsExpanded(true);
                        springBack();
                    }
                }
            };

            const handleSheetTouchStart = (e) => {
                sheetDragStartRef.current = e.touches[0].clientY;
            };
            const handleSheetTouchMove = (e) => {
                if (sheetDragStartRef.current === null) return;
                const delta = e.touches[0].clientY - sheetDragStartRef.current;
                if (delta > 0) setSheetDragY(delta);

            const handleSheetTouchEnd = () => {

                    clearInterval(interval);
                }
                return () => clearInterval(interval);

                const prev = prevTimeRef.current;

                const currentStepIndex = recipe.steps.findIndex(s => s.endTime > prev);
                const nextStepIndex = recipe.steps.findIndex(s => s.endTime > now);

                if(e) e.preventDefault();
                if (timerStatus === 'idle') return;
                stepTimesRef.current = [];

                prevTimeRef.current = 0;

            const handleSkipStep = (e) => {
                if (e) e.preventDefault();
                const { step, index } = currentStepInfo;

                const totalTime = recipe.steps[recipe.steps.length - 1].endTime;

                setCurrentTime(nextTime);
                prevTimeRef.current = nextTime;

                    setCurrentTime(0);
                    prevTimeRef.current = 0;
                    setTimerStatus('idle');

            const doFinish = () => {
                const totalTime = recipe.steps[recipe.steps.length - 1].endTime;

                if (currentTime < totalTime) {
                    const remaining = Math.ceil(totalTime - currentTime);
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    const timeStr = mins > 0 ? `${mins} 分 ${secs} 秒` : `${secs} 秒`;
                    if (!window.confirm(`還差 ${timeStr}，確定提早結束？`)) return;
                }
                const si = currentStepInfo;
                if (si.step) {
                    const prevEnd = si.index > 0 ? recipe.steps[si.index - 1].endTime : 0;
                    stepTimesRef.current[si.index] = {
                        name: si.step.name.split('(')[0].trim(),

                                <svg height={radius * 2} width={radius * 2} className="rotate-[-90deg]">
                                    <circle stroke="#e7e5e4" strokeWidth={stroke} fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                    <circle stroke={arcColor} strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 0.1s linear, stroke 0.3s' }} strokeLinecap="round" fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                </svg>
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6 py-6 pointer-events-none">
                                    {!isFinished ? (
                                        <div className="flex flex-col items-center space-y-1.5" style={{ width: `${centerContentWidth}px`, maxWidth: `${centerContentWidth}px` }}>
                                            <div className="w-full text-center text-[13px] font-bold leading-tight tracking-wide text-amber-600 break-words">
                                                {isReady ? recipe.name.split('(')[0].trim() : step.name.split('(')[0].trim()}
                                            </div>
                                            <div className="text-[42px] font-bold text-neutral-800 tabular-nums tracking-tighter leading-none">
                                                {formatTimerDisplay(currentTime)}
                                            </div>
                                            {!isReady && (
                                                <>
                                                    <div className="text-sm font-mono text-neutral-400">
                                                        到 {formatTimerDisplay(step.endTime)}
                                                    </div>
                                                    <div className="flex max-w-full flex-wrap items-center justify-center gap-1.5 rounded-xl border border-amber-100 bg-amber-50 px-2.5 py-1 text-xs font-bold leading-tight text-amber-700">
                                                        <Droplet className="w-3.5 h-3.5 fill-amber-700" />
                                                        <span>{index > 0 ? `${getStepTargetWater(recipe.steps[index - 1], waterTotal, coffeeGrams)} → ` : ''}{targetWater} ml</span>
                                                    </div>
                                                    {step.desc && (
                                                        <div className="w-full text-center text-[11px] leading-snug text-neutral-500 break-words">
                                                            {step.desc}
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                            {isReady && (
                                                <div className="text-xs text-neutral-400 mt-1">準備好就按開始</div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center space-y-1">
                                            <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center pop-in">
                                                <Coffee className="w-6 h-6" />
                                            </div>
                                            <div className="text-amber-600 font-bold text-lg pop-in" style={{animationDelay:'0.1s'}}>完成</div>
                                            <p className="text-neutral-400 text-xs pop-in" style={{animationDelay:'0.18s'}}>享受您的咖啡</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* ── 三態控制區 ── */}
                        <div className="w-full px-6 mt-auto pb-6 relative z-[999]">
                            {/* ready: 全寬開始按鈕 */}
                            {isReady && (
                                <button
                                    onPointerDown={handleStartStop}
                                    aria-label="開始計時"
                                    className="w-full py-4 bg-amber-600 text-white font-bold rounded-xl shadow-xl shadow-amber-200/60 hover:bg-amber-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer touch-none text-lg"
                                >
                                    <Play className="w-5 h-5 fill-current ml-1" /> 開始計時
                                </button>
                            )}

                            {/* running: Pause (主) + 跳過 (次，所有步驟含最後步驟) */}
                            {isRunning && (
                                <div className="flex items-center justify-center gap-5">
                                    <div className="w-16 h-16 opacity-0 pointer-events-none" aria-hidden="true" />
                                    <button
                                        onPointerDown={handleStartStop}
                                        aria-label="暫停計時器"
                                        className="w-24 h-24 rounded-3xl bg-amber-100 text-amber-600 border-2 border-amber-200 flex items-center justify-center shadow-xl shadow-amber-200/60 cursor-pointer touch-none"
                                    >
                                        <Pause className="w-10 h-10 fill-current" />
                                    </button>
                                    <button
                                        onPointerDown={handleSkipStep}
                                        aria-label="跳過此步驟"
                                        className="group w-16 h-16 rounded-2xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:border-amber-400 group-hover:text-amber-500 shadow-sm transition-colors cursor-pointer touch-none"
                                    >
                                        <SkipForward className="w-6 h-6" />
                                    </button>
                                </div>
                            )}

                            {/* paused (mid-brew): 重設 + 繼續 + 完成 */}
                            {isPaused && (
                                <div className="flex items-center justify-center gap-5">
                                    <button
                                        onPointerDown={handleReset}
                                        aria-label="重設計時器"
                                        className="group w-16 h-16 rounded-2xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:border-neutral-400 group-hover:text-neutral-600 shadow-sm cursor-pointer touch-none"
                                    >
                                        <RotateCcw className="w-6 h-6" />
                                    </button>
                                    <button
                                        onPointerDown={handleStartStop}
                                        aria-label="繼續計時器"
                                        className="w-24 h-24 rounded-3xl bg-amber-600 text-white flex items-center justify-center shadow-xl shadow-amber-200/60 cursor-pointer touch-none"
                                    >
                                        <Play className="w-10 h-10 fill-current ml-1" />
                                    </button>
                                    <button
                                        onPointerDown={handleFinish}
                                        aria-label="完成並儲存沖煮"
                                        className="group w-16 h-16 rounded-2xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:border-neutral-400 group-hover:text-neutral-600 shadow-sm cursor-pointer touch-none"
                                    >
                                        <CheckCircle className="w-6 h-6" />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderJournalView = () => {
                const now = new Date();
                const filteredLogs = logs
                    .filter(log => !searchQuery || (log.beanName || '').toLowerCase().includes(searchQuery.toLowerCase()))
                    .filter(log => {
                        if (beanDrilldown) return true; // 豆子內頁顯示該豆全部紀錄，不受日期篩選限制
                        if (sortBy === 'week') return Date.now() - log.createdAt <= 7 * 86400000;
                        if (sortBy === 'month') { const d = new Date(log.createdAt); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }
                        return true;
                    })
                    .slice()
                    .sort((a, b) => sortBy === 'rating' ? b.rating - a.rating : sortBy === 'oldest' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

                const monthlyCount = logs.filter(l => {
                    const d = new Date(l.createdAt);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }).length;

                const sparkData = [...logs].sort((a, b) => a.createdAt - b.createdAt).filter(l => l.rating).slice(-14);
                const SW = 130, SH = 46;
                const sy = (r) => SH - 5 - ((r - 1) / 4) * (SH - 14);
                const sx = (i) => sparkData.length < 2 ? SW / 2 : (i / (sparkData.length - 1)) * (SW - 10) + 5;
                const sparkPts = sparkData.map((l, i) => `${sx(i)},${sy(l.rating)}`).join(' ');
                const areaPts = sparkData.length > 1
                    ? [`${sx(0)},${SH}`, ...sparkData.map((l, i) => `${sx(i)},${sy(l.rating)}`), `${sx(sparkData.length-1)},${SH}`].join(' ')
                    : '';

                let trendLabel = '', trendCls = '';
                if (sparkData.length >= 4) {
                    const n = Math.min(3, Math.floor(sparkData.length / 2));
                    const recent = sparkData.slice(-n).reduce((s, l) => s + l.rating, 0) / n;
                    const earlier = sparkData.slice(0, n).reduce((s, l) => s + l.rating, 0) / n;
                    if (recent - earlier > 0.3) { trendLabel = '↑ 進步中'; trendCls = 'text-amber-600 font-bold'; }
                    else if (earlier - recent > 0.3) { trendLabel = '↓ 待加強'; trendCls = 'text-neutral-400'; }
                    else { trendLabel = '→ 穩定'; trendCls = 'text-neutral-400'; }
                }

                return (
                    <div className="space-y-4 pb-4">
                        {/* Page header — journal title or bean detail title */}
                        {beanDrilldown ? (() => {
                            const beanLogs = logs.filter(l => (l.beanName || '未命名咖啡豆') === beanDrilldown);
                            const rated = beanLogs.filter(l => l.rating > 0);
                            const avgRating = rated.length ? rated.reduce((s, l) => s + l.rating, 0) / rated.length : 0;
                            const roastInfo = ROAST_LEVELS.find(r => r.id === beanLogs[0]?.roastLevel) || ROAST_LEVELS[0];
                            return (
                                <div>
                                    <button
                                        onClick={() => { setViewMode('byBean'); setSearchQuery(''); setBeanDrilldown(null); }}
                                        className="flex items-center gap-1 text-xs text-amber-600 font-semibold cursor-pointer mb-2"
                                    >
                                        <ChevronLeft className="w-3.5 h-3.5" /> 所有豆子
                                    </button>
                                    <h2 className="text-xl font-bold text-neutral-800 leading-tight truncate">{beanDrilldown}</h2>
                                    <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                        <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${roastInfo.color}`}>{roastInfo.label}</span>
                                        {avgRating > 0 && (
                                            <>
                                                <div className="flex items-center gap-0.5">
                                                    {[1,2,3,4,5].map(s => (
                                                        <Star key={s} className={`w-3 h-3 fill-current ${Math.round(avgRating) >= s ? 'text-amber-400' : 'text-neutral-200'}`} />
                                                    ))}
                                                </div>
                                                <span className="text-xs text-neutral-500 tabular-nums">{avgRating.toFixed(1)}</span>
                                            </>
                                        )}
                                        <span className="text-neutral-300 text-xs">·</span>
                                        <span className="text-xs text-neutral-400">{beanLogs.length} 次沖煮</span>
                                    </div>
                                </div>
                            );
                        })() : (
                            <div className="flex items-center justify-between">
                                <h2 className="text-2xl font-bold text-neutral-800 flex items-center gap-2">
                                    <BookOpen className="w-6 h-6 text-amber-600" /> 沖煮日誌
                                </h2>
                            </div>
                        )}

                        {logs.length > 0 && !beanDrilldown && (
                            <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden flex">
                                <div className="flex flex-col justify-center gap-4 px-5 py-4 border-r border-neutral-100 flex-shrink-0 w-[100px]">
                                    <div>
                                        <div className="text-[28px] font-bold text-neutral-800 leading-none tabular-nums">{logs.length}</div>
                                        <div className="text-xs text-neutral-400 uppercase tracking-widest mt-1">總沖煮</div>
                                    </div>
                                    <div>
                                        <div className="text-[28px] font-bold text-neutral-800 leading-none tabular-nums">{monthlyCount}</div>
                                        <div className="text-xs text-neutral-400 uppercase tracking-widest mt-1">本月</div>
                                    </div>
                                </div>
                                <div className="flex-1 px-4 py-3 flex flex-col justify-between min-w-0">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs text-neutral-400 uppercase tracking-widest">自評成長曲線</span>
                                        {trendLabel && <span className={`text-xs ${trendCls}`}>{trendLabel}</span>}
                                    </div>
                                    {sparkData.length >= 2 ? (
                                        <svg viewBox={`0 0 ${SW} ${SH}`} className="w-full mt-1" style={{overflow:'visible'}}>
                                            {areaPts && <polygon points={areaPts} fill="rgba(217,119,6,0.08)" />}
                                            <polyline points={sparkPts} fill="none" stroke="#d97706" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                                            {(() => {
                                                const last = sparkData[sparkData.length - 1];
                                                return <circle cx={sx(sparkData.length-1)} cy={sy(last.rating)} r="3" fill="#d97706" />;
                                            })()}
                                        </svg>
                                    ) : (
                                        <div className="flex-1 flex items-center justify-center">
                                            <span className="text-xs text-neutral-300">多沖幾杯後顯示</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {logs.length > 0 && !beanDrilldown && (
                            <div className="space-y-2">
                                {/* View toggle */}
                                <div className="flex bg-neutral-100 rounded-xl p-0.5">
                                    <button
                                        onClick={() => { setViewMode('timeline'); setSearchQuery(''); setBeanDrilldown(null); }}
                                        className={`flex-1 py-1.5 rounded-[10px] text-xs font-semibold transition-all cursor-pointer ${viewMode === 'timeline' ? 'bg-white shadow-sm text-neutral-800' : 'text-neutral-400 hover:text-neutral-600'}`}
                                    >
                                        時間軸
                                    </button>
                                    <button
                                        onClick={() => { setViewMode('byBean'); setSearchQuery(''); setBeanDrilldown(null); }}
                                        className={`flex-1 py-1.5 rounded-[10px] text-xs font-semibold transition-all cursor-pointer ${viewMode === 'byBean' ? 'bg-white shadow-sm text-neutral-800' : 'text-neutral-400 hover:text-neutral-600'}`}
                                    >
                                        按豆子
                                    </button>
                                </div>

                                {/* Search + sort (timeline only) */}
                                {viewMode === 'timeline' && (
                                    <div className="flex gap-2 items-center">
                                        <div className="relative flex-1 min-w-0">
                                            <label htmlFor="journal-search" className="sr-only">搜尋豆子名稱</label>
                                            <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                            </svg>
                                            <input
                                                id="journal-search"
                                                type="text"
                                                placeholder="搜尋豆子名稱..."
                                                autoComplete="off"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full pl-9 pr-9 py-2.5 bg-white border border-neutral-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none placeholder:text-neutral-300"
                                            />
                                            {searchQuery && (
                                                <button onClick={() => setSearchQuery('')} aria-label="清除搜尋" className="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-300 hover:text-neutral-500 cursor-pointer">
                                                    <X className="w-4 h-4" />
                                                </button>
                                            )}
                                        </div>
                                        <div className="relative flex-shrink-0">
                                            <label htmlFor="journal-sort" className="sr-only">排序日誌</label>
                                            <select
                                                id="journal-sort"
                                                value={sortBy}
                                                onChange={(e) => setSortBy(e.target.value)}
                                                className="appearance-none bg-white border border-neutral-200 rounded-xl pl-3 pr-7 py-2 text-xs font-bold text-neutral-700 cursor-pointer outline-none focus:ring-2 focus:ring-amber-500"
                                            >
                                                <option value="newest">最新在前</option>
                                                <option value="oldest">最舊在前</option>
                                                <option value="month">本月</option>
                                                <option value="week">本週</option>
                                                <option value="rating">評分高低</option>
                                            </select>
                                            <ChevronDown className="absolute right-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-neutral-400 pointer-events-none" />
                                        </div>
                                    </div>
                                )}

                                {/* Bean search (byBean mode) */}
                                {viewMode === 'byBean' && (
                                    <div className="relative">
                                        <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                        </svg>
                                        <input
                                            type="text"
                                            placeholder="搜尋豆子..."
                                            autoComplete="off"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-9 pr-9 py-2.5 bg-white border border-neutral-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none placeholder:text-neutral-300"
                                        />
                                        {searchQuery && (
                                            <button onClick={() => setSearchQuery('')} aria-label="清除搜尋" className="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-300 hover:text-neutral-500 cursor-pointer">
                                                <X className="w-4 h-4" />
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {logs.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-neutral-200">
                                <div className="mb-3 flex justify-center"><Coffee className="w-12 h-12 text-neutral-200" /></div>
                                <p className="font-medium text-neutral-600 mb-1">還沒有紀錄</p>
                                <p className="text-sm text-neutral-400">沖完一杯後儲存，就會出現在這裡</p>
                            </div>
                        ) : viewMode === 'byBean' ? (() => {
                            // 按豆子分組
                            const beanMap = {};
                            logs.forEach(log => {
                                const key = log.beanName || '未命名咖啡豆';
                                if (!beanMap[key]) beanMap[key] = { beanName: key, roastLevel: log.roastLevel, logs: [] };
                                beanMap[key].logs.push(log);
                            });
                            const beanList = Object.values(beanMap)
                                .filter(g => !searchQuery || g.beanName.toLowerCase().includes(searchQuery.toLowerCase()))
                                .map(g => {
                                    const rated = g.logs.filter(l => l.rating > 0);
                                    const avgRating = rated.length ? rated.reduce((s, l) => s + l.rating, 0) / rated.length : 0;
                                    const lastLog = [...g.logs].sort((a, b) => b.createdAt - a.createdAt)[0];
                                    return { ...g, avgRating, lastLog, lastDate: lastLog.createdAt };
                                })
                                .sort((a, b) => b.lastDate - a.lastDate);

                            if (beanList.length === 0) return (
                                <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-neutral-200">
                                    <p className="text-neutral-400 text-sm">找不到「{searchQuery}」的豆子</p>
                                </div>
                            );

                            return (
                                <div className="space-y-3">
                                    {beanList.map(g => {
                                        const roastInfo = ROAST_LEVELS.find(r => r.id === g.roastLevel) || ROAST_LEVELS[0];
                                        const filledStars = Math.round(g.avgRating);
                                        return (
                                            <div key={g.beanName}
                                                className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden cursor-pointer hover:border-neutral-200 active:opacity-75 transition-all"
                                                onClick={() => { setSearchQuery(g.beanName); setViewMode('timeline'); setBeanDrilldown(g.beanName); }}
                                            >
                                                <div className="p-4">
                                                    <div className="flex items-start justify-between gap-3">
                                                        <div className="flex-1 min-w-0">
                                                            <h3 className="font-bold text-neutral-800 text-base leading-tight truncate">{g.beanName}</h3>
                                                            <div className="flex items-center gap-1.5 mt-1.5">
                                                                <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${roastInfo.color}`}>{roastInfo.label}</span>
                                                                <span className="text-neutral-200 text-xs">·</span>
                                                                <span className="text-xs text-neutral-400">最近：{getRelativeDate(g.lastDate)}</span>
                                                            </div>
                                                        </div>
                                                        <ChevronRight className="w-4 h-4 text-neutral-300 flex-shrink-0 mt-1" />
                                                    </div>
                                                    <div className="flex items-center justify-between mt-3">
                                                        {/* 平均星級 */}
                                                        <div className="flex items-center gap-1.5">
                                                            <div className="flex items-center gap-0.5">
                                                                {[1,2,3,4,5].map(s => (
                                                                    <Star key={s} className={`w-3.5 h-3.5 fill-current ${filledStars >= s ? 'text-amber-400' : 'text-neutral-200'}`} />
                                                                ))}
                                                            </div>
                                                            {g.avgRating > 0 && (
                                                                <span className="text-xs text-neutral-400 tabular-nums">{g.avgRating.toFixed(1)}</span>
                                                            )}
                                                        </div>
                                                        {/* 沖煮次數 */}
                                                        <span className="text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-0.5 rounded-full">
                                                            {g.logs.length} 次沖煮
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            );
                        })() : filteredLogs.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-neutral-200">
                                <p className="text-neutral-400 text-sm">
                                    {searchQuery && !beanDrilldown ? `找不到「${searchQuery}」的紀錄` : '這個時間範圍沒有紀錄'}
                                </p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {filteredLogs.map(log => {
                                    const roastInfo = ROAST_LEVELS.find(r => r.id === log.roastLevel) || ROAST_LEVELS[0];
                                    return (
                                        <div key={log.id} className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden cursor-pointer hover:border-neutral-200 active:opacity-75 transition-all" onClick={() => handleViewLog(log)}>
                                            <div className="p-4 pb-3">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div className="flex-1 min-w-0">
                                                        {beanDrilldown ? (
                                                            /* 豆子內頁：日期為主要標識，隱藏重複的豆子名稱 */
                                                            <h3 className="font-bold text-neutral-800 text-base leading-tight">
                                                                {getRelativeDate(log.createdAt)}
                                                            </h3>
                                                        ) : (
                                                            /* 時間軸：豆子名稱為主要標識 */
                                                            <>
                                                                <h3 className="font-bold text-neutral-800 text-base leading-tight truncate">
                                                                    {log.beanName || '未命名咖啡豆'}
                                                                </h3>
                                                                <div className="flex items-center gap-1.5 mt-1.5">
                                                                    <span className="text-xs text-neutral-500">{getRelativeDate(log.createdAt)}</span>
                                                                    <span className="text-neutral-200 text-xs">·</span>
                                                                    <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${roastInfo.color}`}>{roastInfo.label}</span>
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                    {/* 星級 */}
                                                    {log.rating > 0 ? (
                                                        <div className="flex items-center gap-0.5 flex-shrink-0 pt-0.5">
                                                            {[1,2,3,4,5].map(s => (
                                                                <Star key={s} className={`w-3.5 h-3.5 fill-current ${log.rating >= s ? 'text-amber-400' : 'text-neutral-200'}`} />
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <span className="text-[11px] text-neutral-300 flex-shrink-0 pt-1">未評分</span>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 沖煮參數：食譜 · 比例 · 克重 / 水量 · 時間 */}
                                            <div className="px-4 py-2.5 bg-neutral-50 border-t border-neutral-100 flex items-center gap-2 text-xs text-neutral-400 flex-wrap">
                                                <span className="font-medium text-neutral-600">{(log.recipeName || 'V60').split('(')[0].trim()}</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>1:{log.ratio}</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{log.coffeeGrams}g / {log.waterTotal}ml</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{formatTimerDisplay(log.time)}</span>
                                            </div>

                                            {log.notes && (
                                                <div className="px-4 py-2.5 border-t border-neutral-50">
                                                    <p className="text-xs text-neutral-500 italic line-clamp-1">"{log.notes}"</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="w-full h-[100dvh] sm:h-full bg-neutral-50 flex flex-col font-sans text-neutral-800 overflow-hidden relative">
                    <div className="bg-white px-6 py-4 shadow-sm z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                                <Coffee className="w-5 h-5 text-white" />
                            </div>
                            <span className="font-bold text-lg tracking-tight">Barista Flow</span>
                        </div>
                        <div className="text-xs font-mono text-neutral-400 cursor-help" title="資料儲存在您的裝置，不會上傳至雲端">本地模式</div>
                    </div>

                    <div ref={contentRef} className={`flex-1 scroll-smooth ${
                        (activeTab === 'brew' && timerStatus !== 'idle') ? 'overflow-hidden' :
                        (activeTab === 'brew' && brewStep === 'home')    ? 'overflow-hidden px-5 py-5' :
                        'overflow-y-auto px-5 py-5'
                    }`} style={{overscrollBehavior:'contain'}}>
                        {activeTab === 'brew' && timerStatus !== 'idle' && renderTimerView()}
                        {activeTab === 'brew' && timerStatus === 'idle' && (
                            brewStep === 'home'       ? renderHomeView() :
                            brewStep === 'config'     ? renderConfigView() :
                            renderSuggestionView()
                        )}
                        {activeTab === 'journal' && renderJournalView()}
                    </div>

                    {activeTab === 'brew' && timerStatus === 'idle' && brewStep === 'config' && (
                        <div className="px-4 pt-2 pb-2 bg-gradient-to-t from-neutral-50 via-neutral-50 to-transparent flex-shrink-0">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); setBrewStep('suggestion'); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-amber-200/60 hover:bg-amber-700 transition-all flex items-center justify-center gap-2 cursor-pointer touch-none active:scale-95"
                            >
                                查看沖煮建議 <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                    )}
                    {activeTab === 'brew' && timerStatus === 'idle' && brewStep === 'suggestion' && (
                        <div className="px-4 pt-2 pb-2 bg-gradient-to-t from-neutral-50 via-neutral-50 to-transparent flex-shrink-0">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); unlockAudio(); setTimerStatus('paused'); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-amber-200/60 hover:bg-amber-700 transition-all flex items-center justify-center gap-2 cursor-pointer touch-none active:scale-95"
                            >
                                <Play className="w-5 h-5 fill-current ml-1" /> 開始沖煮
                            </button>
                        </div>
                    )}

                    <div className="bg-white border-t border-neutral-100 flex justify-around items-center px-6 w-full flex-shrink-0" style={{ paddingTop: '10px', paddingBottom: 'max(18px, env(safe-area-inset-bottom))' }}>
                        <button
                            onClick={() => {
                                if (activeTab === 'brew' && timerStatus === 'idle') {
                                    setBrewStep('home');
                                } else {
                                    setActiveTab('brew');
                                }
                            }}
                            className={`flex flex-col items-center gap-1 min-h-[44px] min-w-[60px] justify-center transition-colors cursor-pointer ${activeTab === 'brew' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <Droplet className="w-6 h-6" />
                            <span className="text-xs font-medium">沖煮</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('journal')}
                            className={`flex flex-col items-center gap-1 min-h-[44px] min-w-[60px] justify-center transition-colors cursor-pointer ${activeTab === 'journal' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <BookOpen className="w-6 h-6" />
                            <span className="text-xs font-medium">日誌</span>
                        </button>
                    </div>

                    {saveFeedback && (
                        <div
                            className="fixed left-1/2 bottom-24 z-[2500] -translate-x-1/2 rounded-full bg-neutral-900 px-4 py-2 text-sm font-medium text-white shadow-xl"
                            role="status"
                            aria-live="polite"
                        >
                            {saveFeedback}
                        </div>
                    )}

                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black/50 z-[2000] flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm animate-in fade-in">
                            <div ref={modalPanelRef} tabIndex={-1} className="outline-none bg-white w-full sm:max-w-sm sm:rounded-2xl rounded-t-2xl shadow-2xl animate-in slide-in-from-bottom sm:zoom-in-95 duration-200 max-h-[82vh] flex flex-col">

                                {/* Header */}
                                <div className="px-4 pt-3 pb-2.5 border-b border-neutral-100">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-base font-bold text-neutral-800">{editingLogId ? '編輯紀錄' : '紀錄這杯'}</h3>
                                        <button onClick={handleCloseModalX} aria-label="關閉紀錄視窗" className="p-1.5 text-neutral-400 hover:text-neutral-600 rounded-lg hover:bg-neutral-100 transition-colors cursor-pointer">
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-2 mt-0.5">
                                        <span className="text-xs text-neutral-500 font-medium truncate">
                                            {beanName || '未命名咖啡豆'} · {ROAST_LEVELS.find(r => r.id === roastLevel)?.label || '淺焙'}
                                        </span>
                                        {!editingLogId && (
                                            <span className={`flex-shrink-0 text-[10px] px-1.5 py-0.5 rounded-full font-medium border ${
                                                flowRate === 'fast' ? 'bg-amber-50 text-amber-600 border-amber-200' :
                                                flowRate === 'clog' ? 'bg-neutral-100 text-neutral-500 border-neutral-200' :
                                                'bg-green-50 text-green-600 border-green-100'
                                            }`}>
                                                {flowRate === 'fast' ? '流速偏快' : flowRate === 'clog' ? '疑似堵塞' : '流速正常'}
                                            </span>
                                        )}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto overscroll-contain px-4 pt-2 pb-2 space-y-2">
                                    {/* 評分 — 最重要，放最上方 */}
                                    <div className="rounded-2xl bg-amber-50 border border-amber-100 py-2.5 px-3 flex items-center justify-between gap-3">
                                        <p className="text-[11px] font-bold text-amber-600 uppercase tracking-widest whitespace-nowrap">
                                            {rating === 0 ? '這杯如何？' : ['', '還要加油', '普通', '不錯喝', '很好喝！', '完美！'][rating]}
                                        </p>
                                        <div className="flex gap-0.5">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    type="button"
                                                    aria-label={`評分 ${star} 星`}
                                                    aria-pressed={rating === star}
                                                    onClick={() => setRating(star)}
                                                    className={`p-1 transition-all duration-150 active:scale-125 cursor-pointer hover:scale-110 ${
                                                        rating >= star
                                                            ? 'text-amber-400 drop-shadow-sm'
                                                            : 'text-neutral-300 hover:text-amber-200'
                                                    }`}
                                                >
                                                    <Star className="w-7 h-7 fill-current" />
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 風味雷達 */}
                                    <div className="space-y-1">
                                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">風味雷達</p>
                                        <RadarChart
                                            data={sensory}
                                            onChange={(key, val) => setSensory(prev => ({ ...prev, [key]: val }))}
                                        />
                                        <p className="text-center text-xs text-neutral-300">往各方向拖曳調整</p>
                                    </div>

                                    {/* 備註 */}
                                    <label htmlFor="log-notes" className="sr-only">沖煮備註</label>
                                    <textarea
                                        id="log-notes"
                                        placeholder="備註（選填）"
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none h-14"
                                    />

                                </div>
                                {/* Sticky footer — always visible, no scroll needed */}
                                <div className="flex-shrink-0 flex gap-3 px-4 py-3 border-t border-neutral-100">
                                    {editingLogId && (
                                        <button
                                            onClick={() => { if (window.confirm('確定刪除這筆紀錄？')) deleteLog(); }}
                                            aria-label="刪除紀錄"
                                            title="刪除紀錄"
                                            className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-all cursor-pointer"
                                        >
                                            <Trash2 className="w-4 h-4" />
                                        </button>
                                    )}
                                    <button
                                        onClick={saveLog}
                                        className="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl shadow-xl shadow-amber-200/60 hover:bg-amber-700 transition-all cursor-pointer"
                                    >
                                        {editingLogId ? '更新紀錄' : '儲存紀錄'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {viewingLog && (() => {
                        const vl = viewingLog;
                        const vlRoast = ROAST_LEVELS.find(r => r.id === vl.roastLevel) || ROAST_LEVELS[0];
                        const vlSensory = vl.sensory || { acidity: 3, sweetness: 3, bitterness: 3, body: 3 };
                        return (
                            <div className="fixed inset-0 bg-black/50 z-[2000] flex items-end justify-center backdrop-blur-sm" onClick={() => setViewingLog(null)}>
                                <div
                                    className="bg-white w-full max-w-md rounded-t-3xl shadow-2xl max-h-[88vh] overflow-y-auto"
                                    style={{ transform: `translateY(${sheetDragY}px)`, transition: sheetDragY === 0 ? 'transform 0.3s ease' : 'none' }}
                                    onClick={e => e.stopPropagation()}
                                >
                                    <div
                                        className="flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing touch-none"
                                        onTouchStart={handleSheetTouchStart}
                                        onTouchMove={handleSheetTouchMove}
                                        onTouchEnd={handleSheetTouchEnd}
                                    >
                                        <div className="w-10 h-1 rounded-full bg-neutral-200" />
                                    </div>

                                    <div className="flex items-start justify-between px-5 pt-3 pb-3">
                                        <div className="flex-1 min-w-0 pr-3">
                                            <h3 className="text-xl font-bold text-neutral-800 truncate">{vl.beanName || '未命名咖啡豆'}</h3>
                                            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                                <span className={`text-xs px-2 py-0.5 rounded-full border font-medium ${vlRoast.color}`}>{vlRoast.label}</span>
                                                <span className="text-xs text-neutral-400">{vl.dripperName || 'V60'}</span>
                                                <span className="text-xs text-neutral-300">·</span>
                                                <span className="text-xs text-neutral-400">{getRelativeDate(vl.createdAt)}</span>
                                            </div>
                                        </div>
                                        <button onClick={() => setViewingLog(null)} aria-label="關閉紀錄詳情" className="p-1.5 text-neutral-400 hover:text-neutral-600 rounded-lg hover:bg-neutral-100 transition-colors cursor-pointer flex-shrink-0">
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div className="px-5 pb-8 space-y-4">
                                        <div className="flex items-center gap-1.5">
                                            {[1,2,3,4,5].map(star => (
                                                <Star key={star} className={`w-6 h-6 fill-current ${vl.rating >= star ? 'text-amber-400' : 'text-neutral-200'}`} />
                                            ))}
                                            {vl.rating > 0 && (
                                                <span className="ml-1 text-sm text-neutral-400">
                                                    {['','還要加油','普通','不錯喝','很好喝','完美'][vl.rating]}
                                                </span>
                                            )}
                                        </div>

                                        <div>
                                            <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2">風味雷達</p>
                                            <RadarChart data={vlSensory} onChange={null} />
                                        </div>

                                        <div className="flex gap-2">
                                            {vl.flowRate && (
                                                <div className="flex-1 bg-neutral-50 border border-neutral-100 rounded-xl p-3 text-center">
                                                    <p className="text-xs text-neutral-400 font-medium mb-1">流速</p>
                                                    <p className="text-sm font-bold text-neutral-700">{FLOW_OPTIONS.find(f => f.id === vl.flowRate)?.label || '—'}</p>
                                                </div>
                                            )}
                                            <div className="flex-1 bg-neutral-50 border border-neutral-100 rounded-xl p-3 text-center">
                                                <p className="text-xs text-neutral-400 font-medium mb-1">時間</p>
                                                <p className="text-sm font-bold text-neutral-700 font-mono">{formatTimerDisplay(vl.time)}</p>
                                            </div>
                                        </div>

                                        <div className="bg-neutral-50 rounded-xl p-3 flex items-center justify-around text-center">
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">粉量</p>
                                                <p className="font-bold text-neutral-800 text-sm">{vl.coffeeGrams}g</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">水量</p>
                                                <p className="font-bold text-neutral-800 text-sm">{vl.waterTotal}ml</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">比例</p>
                                                <p className="font-bold text-neutral-800 text-sm">1:{Math.round(vl.ratio)}</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div className="max-w-[60px]">
                                                <p className="text-xs text-neutral-400 mb-0.5">配方</p>
                                                <p className="font-bold text-neutral-800 text-xs truncate">{(vl.recipeName || '').split('(')[0].trim()}</p>
                                            </div>
                                        </div>

                                        {vl.stepTimes && vl.stepTimes.length > 0 && (
                                            <div className="space-y-1.5">
                                                <p className="text-[11px] font-bold text-neutral-400 uppercase tracking-widest">步驟時間</p>
                                                {vl.stepTimes.map((st, i) => {
                                                    const ratio = st.actual / st.planned;
                                                    const { label, cls } =
                                                        ratio < 0.60  ? { label: '過快', cls: 'bg-red-50 text-red-500 border-red-100' } :
                                                        ratio < 0.85  ? { label: '偏快', cls: 'bg-amber-50 text-amber-600 border-amber-100' } :
                                                        ratio <= 1.20 ? { label: '正常', cls: 'bg-green-50 text-green-600 border-green-100' } :
                                                        ratio <= 1.50 ? { label: '偏慢', cls: 'bg-blue-50 text-blue-600 border-blue-100' } :
                                                                        { label: '過慢', cls: 'bg-red-50 text-red-500 border-red-100' };
                                                    return (
                                                        <div key={i} className="flex items-center gap-2">
                                                            <span className="text-xs text-neutral-500 flex-1 truncate">{st.name}</span>
                                                            <span className="text-xs tabular-nums text-neutral-400">{st.actual}s <span className="text-neutral-300">/ {st.planned}s</span></span>
                                                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full border ${cls}`}>{label}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {vl.notes && (
                                            <div className="bg-amber-50 rounded-xl p-3.5 border border-amber-100">
                                                <p className="text-sm text-amber-900 italic">"{vl.notes}"</p>
                                            </div>
                                        )}

                                        <div className="flex gap-3 pt-1">
                                            <button
                                                onClick={() => {
                                                    if (!window.confirm('確定刪除這筆紀錄？')) return;
                                                    const updatedLogs = logs.filter(l => l.id !== vl.id);
                                                    setLogs(updatedLogs);
                                                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs)); } catch(e) {}
                                                    setViewingLog(null);
                                                }}
                                                aria-label="刪除紀錄"
                                                title="刪除紀錄"
                                                className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-all cursor-pointer"
                                            >
                                                <Trash2 className="w-4 h-4" />
                                            </button>
                                            <button
                                                onClick={() => { setViewingLog(null); handleEditLog(vl); }}
                                                className="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl hover:bg-amber-700 transition-colors cursor-pointer"
                                            >
                                                編輯
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BaristaFlow />);
    </script>
</body>
</html>
