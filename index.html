        }
        @keyframes fadeIn {
            from { opacity: 0; }

        }
        /* Spring easing: accelerates then overshoots slightly before settling */
        .sheet-panel {
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);

        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
            try {
                // 確保 Context 存在
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                
                if (!audioCtx) return;

                // 再次嘗試恢復 (以防萬一)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 聲音包絡線 (避免爆音)
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

        function RadarChart({ data, onChange }) {
            const cx = 100, cy = 100, maxR = 68;
            const svgRef = useRef(null);
            const draggingRef = useRef(null);

            const axes = [
                { key: 'acidity',    label: '酸值', angle: -Math.PI / 2 },
                { key: 'sweetness',  label: '甜感', angle: 0 },
                { key: 'bitterness', label: '苦味', angle: Math.PI / 2 },
                { key: 'body',       label: '醇厚', angle: Math.PI },
            ];

            const pt = (angle, r) => ({
                x: +(cx + r * Math.cos(angle)).toFixed(1),
                y: +(cy + r * Math.sin(angle)).toFixed(1),
            });

            const gridPath = (r) => {
                const pts = axes.map(a => pt(a.angle, r));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            };

            const dataPath = (() => {
                const pts = axes.map(a => pt(a.angle, (data[a.key] / 5) * maxR));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            })();

            const getSvgXY = (e) => {
                const svg = svgRef.current;
                if (!svg) return null;
                const rect = svg.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return {
                    x: ((src.clientX - rect.left) / rect.width) * 200,
                    y: ((src.clientY - rect.top) / rect.height) * 200,
                };
            };

            const nearestAxis = (dx, dy) => {
                const angle = Math.atan2(dy, dx);
                let best = axes[0], minD = Infinity;
                axes.forEach(a => {
                    let d = Math.abs(angle - a.angle);
                    if (d > Math.PI) d = 2 * Math.PI - d;
                    if (d < minD) { minD = d; best = a; }
                });
                return best;
            };

            const projValue = (dx, dy, axis) => {
                const proj = dx * Math.cos(axis.angle) + dy * Math.sin(axis.angle);
                return Math.max(1, Math.min(5, Math.round((proj / maxR) * 5)));
            };

            const onDown = (e) => {
                if (!onChange) return;
                e.preventDefault();
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                const axis = nearestAxis(dx, dy);
                draggingRef.current = axis;
                onChange(axis.key, projValue(dx, dy, axis));
            };

            const onMove = (e) => {
                if (!onChange || !draggingRef.current) return;
                e.preventDefault();
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                onChange(draggingRef.current.key, projValue(dx, dy, draggingRef.current));
            };

            const onUp = () => { draggingRef.current = null; };

            return (
                <svg
                    ref={svgRef}
                    viewBox="-22 -16 244 232"
                    style={{ width: '100%', maxWidth: '260px', display: 'block', margin: '0 auto', touchAction: 'none', cursor: onChange ? 'crosshair' : 'default' }}
                    onPointerDown={onDown}
                    onPointerMove={onMove}
                    onPointerUp={onUp}
                    onPointerLeave={onUp}
                >
                    {[1,2,3,4,5].map(l => (
                        <path key={l} d={gridPath((l/5)*maxR)} fill="none" stroke={l===5?"#d1d5db":"#e5e7eb"} strokeWidth={l===5?1.5:1} />
                    ))}
                    {axes.map(a => {
                        const end = pt(a.angle, maxR);
                        return <line key={a.key} x1={cx} y1={cy} x2={end.x} y2={end.y} stroke="#d1d5db" strokeWidth="1" />;
                    })}
                    <path d={dataPath} fill="rgba(217,119,6,0.18)" stroke="#d97706" strokeWidth="2" strokeLinejoin="round" />
                    {axes.map(a => {
                        const p = pt(a.angle, (data[a.key] / 5) * maxR);
                        return <circle key={a.key} cx={p.x} cy={p.y} r="5" fill="#d97706" stroke="white" strokeWidth="2" style={{ pointerEvents: 'none' }} />;
                    })}
                    {axes.map(a => {
                        const lp = pt(a.angle, maxR + 20);
                        return (
                            <text key={a.key} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" style={{ pointerEvents: 'none', userSelect: 'none' }}>
                                <tspan fontSize="13" fill="#78716c" fontWeight="bold">{a.label} </tspan>
                                <tspan fontSize="13" fill="#d97706" fontWeight="bold">{data[a.key]}</tspan>
                            </text>
                        );
                    })}
                </svg>
            );
        }

                setSheetIsDragging(true);
            };
            const onSheetTouchMove = (e) => {
                if (sheetDragStartY.current === null) return;
                e.preventDefault();
                const delta = e.touches[0].clientY - sheetDragStartY.current;
                if (sheetIsExpanded) {
                    setSheetDragOffset(Math.max(0, delta));
                } else {
                    setSheetDragOffset(delta < 0 ? Math.max(delta * 0.15, -18) : Math.min(delta, 260));
                }
            };
            const onSheetTouchEnd = (e) => {
                if (sheetDragStartY.current === null) return;
                const delta = e.changedTouches[0].clientY - sheetDragStartY.current;
                const { name, setOpen } = sheetDragMeta.current || {};
                sheetDragStartY.current = null;
                setSheetIsDragging(false);
                setSheetDragOffset(0);
                if (!name) return;
                if (sheetIsExpanded) {
                    if (delta > 220) { closeBottomSheet(name, setOpen); }
                    else if (delta > 80) { setSheetIsExpanded(false); }
                } else {
                    if (delta > 110) { closeBottomSheet(name, setOpen); }
                    else if (delta < -55) { setSheetIsExpanded(true); }
                }
            };

            const getBottomSheetStyle = () => (
                closingSheet
                    ? undefined
                    : { transform: `translate3d(0, ${sheetDragOffset}px, 0)` }
            );

            const handleSheetTouchStart = (e) => {
                sheetDragStartRef.current = e.touches[0].clientY;
            };
            const handleSheetTouchMove = (e) => {
                if (sheetDragStartRef.current === null) return;
                const delta = e.touches[0].clientY - sheetDragStartRef.current;
                if (delta > 0) setSheetDragY(delta);
            };
            const handleSheetTouchEnd = () => {
                if (sheetDragY > 100) setViewingLog(null);
                setSheetDragY(0);
                sheetDragStartRef.current = null;
            };

            const recipe = RECIPES[selectedRecipeId];
            const waterTotal = Math.round(coffeeGrams * ratio);
            const selectedDripper = DRIPPERS.find(d => d.id === selectedDripperId) || DRIPPERS[0];

            const updateRecipe = (recipeId) => {
                const nextRecipe = RECIPES[recipeId];
                if (!nextRecipe) return;
                setSelectedRecipeId(recipeId);
                setRatio(recipeRatios[recipeId] ?? nextRecipe.ratio);
                setCurrentTime(0);
                prevTimeRef.current = 0;
            };

            const chooseRecipeAndCollapse = (recipeId) => {
                updateRecipe(recipeId);
                setTimeout(() => closeBottomSheet('recipe', setRecipeSheetOpen), 280);
            };
            
            useEffect(() => {
                let interval = null;
                if (timerStatus === 'running') {
                    interval = setInterval(() => {
                        setCurrentTime(prev => prev + 0.1);
                    }, 100);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [timerStatus]);

            useEffect(() => {
                if (timerStatus !== 'running') return;

                const prev = prevTimeRef.current;
                const now = currentTime;
                const currentStepIndex = recipe.steps.findIndex(s => s.endTime > prev);
                const nextStepIndex = recipe.steps.findIndex(s => s.endTime > now);
                
                if (currentStepIndex !== -1 && nextStepIndex !== -1 && currentStepIndex !== nextStepIndex) {
                    playBeep(880, 'sine', 0.2);
                }
                prevTimeRef.current = now;
            }, [currentTime, timerStatus, recipe]);

            useEffect(() => {
                if (!saveFeedback) return;
                const timeout = setTimeout(() => setSaveFeedback(''), 2400);
                return () => clearTimeout(timeout);
            }, [saveFeedback]);

            const handleStartStop = (e) => {
                if(e) e.preventDefault(); 
                unlockAudio(); // 關鍵：解鎖音效引擎
                
                if (timerStatus === 'idle') {
                    playBeep(600, 'triangle', 0.1);
                    setTimerStatus('running');
                } else if (timerStatus === 'running') {
                    setTimerStatus('paused');
                } else if (timerStatus === 'paused') {
                    setTimerStatus('running');
                }
            };

            const handleReset = (e) => {
                if(e) e.preventDefault();
                if (timerStatus === 'idle') return;
                setTimerStatus('idle');
                setCurrentTime(0);
                prevTimeRef.current = 0;
            };

            const handleFinish = (e) => {
                if(e) e.preventDefault();
                const totalTime = recipe.steps[recipe.steps.length - 1].endTime;
                if (currentTime < totalTime) {
                    const remaining = Math.ceil(totalTime - currentTime);
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    const timeStr = mins > 0 ? `${mins} 分 ${secs} 秒` : `${secs} 秒`;
                    if (!window.confirm(`還差 ${timeStr} 才到預設結束時間\n確定要提早完成沖煮？`)) return;
                }
                setFlowRate(currentTime >= totalTime - 5 ? 'good' : 'fast');
                setTimerStatus('finished');
                setEditingLogId(null);
                setShowSaveModal(true);
                playBeep(440, 'sine', 0.1);
                setTimeout(() => playBeep(660, 'sine', 0.3), 150);
            };

            const handleEditLog = (log) => {
                setEditingLogId(log.id);
                setBeanName(log.beanName);
                setRoastLevel(log.roastLevel);
                setRating(log.rating);
                setSensory(log.sensory || { acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
                setFlowRate(log.flowRate || 'good');
                setStability(log.stability || 'stable');
                setNotes(log.notes);
                setShowSaveModal(true);
            };

            const closeModal = () => {
                setShowSaveModal(false);
                setEditingLogId(null);
                handleReset();
                setNotes('');
                setBeanName('');
                setRoastLevel('light');
                setRating(5);
                setSensory({ acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
                setFlowRate('good');
                setStability('stable');
            };

            const handleCloseModalX = () => {
                if (!editingLogId) {
                    if (!window.confirm('放棄此次沖煮紀錄？')) return;
                }
                closeModal();
            };

            const handleViewLog = (log) => {
                setViewingLog(log);
            };

            const saveLog = async () => {
                let updatedLogs;

                if (editingLogId) {
                    updatedLogs = logs.map(l => {
                        if (l.id === editingLogId) {
                            return {
                                ...l,
                                beanName: beanName || '未命名咖啡豆',
                                roastLevel,
                                rating,
                                sensory,
                                flowRate,
                                stability,
                                notes
                            };
                        }
                        return l;
                    });
                } else {
                    const newLog = {
                        id: Date.now().toString(),
                        recipeName: recipe.name,
                        dripperName: selectedDripper.fullName,
                        coffeeGrams,
                        waterTotal,
                        ratio,
                        time: Math.round(currentTime),
                        rating,
                        sensory,
                        flowRate,
                        stability,
                        beanName: beanName || '未命名咖啡豆',
                        roastLevel,
                        notes,
                        createdAt: Date.now()
                    };
                    updatedLogs = [newLog, ...logs];
                }

                setLogs(updatedLogs);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                    setSaveFeedback(editingLogId ? '紀錄已更新' : '紀錄已儲存');
                } catch (e) {
                    console.error("Failed to save log", e);
                    setSaveFeedback('儲存失敗，請確認瀏覽器儲存空間');
                }

                closeModal();
                setActiveTab('journal');
            };

            const deleteLog = async () => {
                if (!editingLogId) return;
                
                if (confirm('確定要刪除這筆紀錄嗎？')) {
                    const updatedLogs = logs.filter(l => l.id !== editingLogId);
                    setLogs(updatedLogs);
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                    } catch (e) {
                        console.error("Failed to update local storage", e);
                    }
                    closeModal();
                }
            };

            const updateSensory = (key, value) => {
                setSensory(prev => ({ ...prev, [key]: value }));
            };

            const getStepInfo = (targetTime) => {
                const stepIndex = recipe.steps.findIndex(s => s.endTime >= targetTime);
                const index = stepIndex === -1 ? recipe.steps.length - 1 : stepIndex;
                const step = recipe.steps[index];
                const prevEndTime = index > 0 ? recipe.steps[index - 1].endTime : 0;
                const duration = step.endTime - prevEndTime;
                const timeInStep = targetTime - prevEndTime;
                
                return { 
                    step, 
                    index, 
                    duration, 
                    timeInStep: Math.min(Math.max(timeInStep, 0), duration),
                    targetWater: getStepTargetWater(step, waterTotal, coffeeGrams)
                };
            };

            const currentStepInfo = getStepInfo(currentTime);

            const getRecommendedRecipeId = (flavor, dripperId) => {
                if (flavor === 'bright') return 'v60';
                if (flavor === 'rich') return 'fourSix';
                return ['kalita', 'bluebottle'].includes(dripperId) ? 'fourSix' : 'v60';
            };

            const getGrindSetting = (grinderId) => {
                if (!grinderId) return '—';
                const c = GRINDER_CLICKS[grinderId];
                return c?.recommend ? `建議 ${c.recommend}` : '—';
            };

            // --- Views ---
            // --- Home ---
            const brewAgain = (log) => {
                const dripper = DRIPPERS.find(d => d.fullName === log.dripperName) || DRIPPERS[0];
                const rec = Object.values(RECIPES).find(r => r.name === log.recipeName);
                const recipeId = rec ? rec.id : 'v60';
                setSelectedDripperId(dripper.id);
                setSelectedRecipeId(recipeId);
                setCoffeeGrams(log.coffeeGrams);
                setRatio(log.ratio);
                setRecipeRatios(prev => ({ ...prev, [recipeId]: log.ratio }));
                setRoastLevel(log.roastLevel);
                setWaterTemp(WATER_TEMPS[log.roastLevel] || 90);
                setBeanName(log.beanName !== '未命名咖啡豆' ? log.beanName : '');
                setBrewStep('suggestion');
            };

            const renderHomeView = () => {
                const lastLog = logs[0];
                const lastRoast = lastLog ? ROAST_LEVELS.find(r => r.id === lastLog.roastLevel) : null;
                return (

                        {/* Upper section — light, illustration */}
                        <div className="flex-1 flex items-center justify-center">
                            <PourOverIllustration />
                        </div>

                        {/* Lower section — heavy, anchored CTA */}
                        <div className="space-y-3 pb-2">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); unlockAudio(); setBrewStep('config'); }}
                                className="w-full bg-amber-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl shadow-amber-200/60 hover:bg-amber-700 transition-all flex items-center justify-center gap-3 cursor-pointer touch-none active:scale-95"
                            >
                                <Play className="w-6 h-6 fill-current ml-1" /> 開始沖煮
                            </button>
                            <p className="text-center text-xs text-neutral-400">選擇風味、豆子、濾杯、磨豆機</p>

                            {lastLog && (
                                <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden">
                                    <div className="px-4 py-2.5 border-b border-neutral-50 flex items-center justify-between">
                                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">上次沖煮</p>
                                        <span className="text-xs text-amber-400">{'★'.repeat(lastLog.rating)}</span>
                                    </div>
                                    <div className="px-4 py-3 flex items-center gap-3">
                                        <div className="flex-1 min-w-0">
                                            <p className="font-semibold text-neutral-800 text-sm truncate">{lastLog.beanName || '未命名咖啡豆'}</p>
                                            <div className="flex items-center gap-2 mt-1 flex-wrap">
                                                {lastRoast && (
                                                    <span className={`text-xs px-1.5 py-0.5 rounded-full border ${lastRoast.color}`}>{lastRoast.label}</span>
                                                )}
                                                <span className="text-xs text-neutral-400">{lastLog.dripperName}</span>
                                                <span className="text-xs text-neutral-300">·</span>
                                                <span className="text-xs text-neutral-400 font-mono">{lastLog.coffeeGrams}g · 1:{Math.round(lastLog.ratio)}</span>
                                            </div>
                                        </div>
                                        <button
                                            onPointerDown={(e) => { e.preventDefault(); unlockAudio(); brewAgain(lastLog); }}
                                            className="flex-shrink-0 px-3 py-2 rounded-xl border border-amber-200 text-amber-600 font-bold text-xs cursor-pointer touch-none active:scale-95 transition-all hover:bg-amber-50"
                                        >
                                            再沖一次
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // --- Config View ---
            const renderConfigView = () => {
                const seen = new Set();
                const recentBeans = logs
                    .filter(l => l.beanName && l.beanName !== '未命名咖啡豆')
                    .filter(l => { if (seen.has(l.beanName)) return false; seen.add(l.beanName); return true; })
                    .slice(0, 20);
                const selectedRoast = ROAST_LEVELS.find(r => r.id === roastLevel);
                const selectedDripperObj = DRIPPERS.find(d => d.id === selectedDripperId);
                const selectedGrinderObj = GRINDERS.find(g => g.id === selectedGrinder);
                const grindHint = selectedGrinder ? (GRINDER_CLICKS[selectedGrinder]?.recommend ? `建議 ${GRINDER_CLICKS[selectedGrinder].recommend}` : null) : null;

                return (
                    <div className="pb-24 select-none space-y-3">
                        {/* Header */}
                        <div className="flex items-center gap-3 mb-1">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); setBrewStep('home'); }}
                                aria-label="返回首頁"
                                className="w-9 h-9 rounded-xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 hover:text-neutral-600 cursor-pointer touch-none flex-shrink-0"
                            >
                                <ChevronLeft className="w-5 h-5" />
                            </button>
                            <div>
                                <p className="text-xs text-neutral-400 uppercase tracking-widest font-medium">步驟 1</p>
                                <p className="text-base font-bold text-neutral-800">沖煮設定</p>
                            </div>
                        </div>

                        {/* 風味偏好 - vertical cards */}
                        <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm p-4">
                            <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest mb-3">風味偏好</p>
                            <div className="flex flex-col gap-2">
                                {FLAVOR_OPTIONS.map(f => {
                                    const isActive = selectedFlavor === f.id;
                                    return (
                                        <button
                                            key={f.id}
                                            onPointerDown={(e) => {
                                                e.preventDefault();
                                                setSelectedFlavor(f.id);
                                                const rid = getRecommendedRecipeId(f.id, selectedDripperId);
                                                updateRecipe(rid);
                                            }}
                                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition-all cursor-pointer touch-none active:scale-[0.98] ${
                                                isActive ? 'border-amber-500 bg-amber-50' : 'border-neutral-100 bg-neutral-50'
                                            }`}
                                        >
                                            <div className={`w-2 h-2 rounded-full shrink-0 ${isActive ? 'bg-amber-500' : 'bg-neutral-300'}`} />
                                            <div className="flex-1 text-left">
                                                <p className={`text-sm font-bold ${isActive ? 'text-amber-700' : 'text-neutral-800'}`}>{f.label}</p>
                                                <p className="text-xs text-neutral-400 mt-0.5">{f.desc}</p>
                                            </div>
                                            {isActive && <div className="w-4 h-4 rounded-full bg-amber-500 flex items-center justify-center shrink-0">
                                                <svg viewBox="0 0 10 10" className="w-2.5 h-2.5" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
                                            </div>}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 選擇列：豆子 / 濾杯 / 磨豆機 */}
                        <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden">
                            <button
                                onClick={() => { setAddingNewBean(recentBeans.length === 0); setSheetBeanName(''); setSheetRoastDate(''); setSheetRoastLevel(roastLevel); setBeanSheetOpen(true); }}
                                className="w-full flex items-center px-4 py-4 gap-3 cursor-pointer active:bg-neutral-50 border-b border-neutral-50"
                            >
                                <span className="text-xs font-bold text-neutral-400 w-12 text-left shrink-0">豆子</span>
                                <span className={`flex-1 text-sm text-left truncate ${beanName ? 'font-medium text-neutral-800' : 'text-neutral-400'}`}>
                                    {beanName || '選擇咖啡豆'}
                                </span>
                                {beanName && selectedRoast && (
                                    <span className={`text-xs px-2 py-0.5 rounded-full border shrink-0 ${selectedRoast.color}`}>{selectedRoast.label}</span>
                                )}
                                <ChevronRight className="w-4 h-4 text-neutral-300 shrink-0" />
                            </button>
                            <button
                                onClick={() => setDripperSheetOpen(true)}
                                className="w-full flex items-center px-4 py-4 gap-3 cursor-pointer active:bg-neutral-50 border-b border-neutral-50"
                            >
                                <span className="text-xs font-bold text-neutral-400 w-12 text-left shrink-0">濾杯</span>
                                <span className={`flex-1 text-sm text-left ${selectedDripperObj ? 'font-medium text-neutral-800' : 'text-neutral-400'}`}>
                                    {selectedDripperObj?.name || '選擇濾杯'}
                                </span>
                                <ChevronRight className="w-4 h-4 text-neutral-300 shrink-0" />
                            </button>
                            <button
                                onClick={() => setGrinderSheetOpen(true)}
                                className="w-full flex items-center px-4 py-4 gap-3 cursor-pointer active:bg-neutral-50"
                            >
                                <span className="text-xs font-bold text-neutral-400 w-12 text-left shrink-0">磨豆機</span>
                                <span className={`flex-1 text-sm text-left ${selectedGrinderObj ? 'font-medium text-neutral-800' : 'text-neutral-400'}`}>
                                    {selectedGrinderObj?.short || '選擇磨豆機'}
                                </span>
                                {grindHint && <span className="text-xs font-mono text-amber-600 shrink-0">{grindHint}</span>}
                                <ChevronRight className="w-4 h-4 text-neutral-300 shrink-0" />
                            </button>
                        </div>

                        {/* 粉水比 */}
                        <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm p-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">粉水比</p>
                                    <p className="text-xs text-neutral-400 mt-0.5">總水量 {waterTotal} ml</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button
                                        onPointerDown={(e) => { e.preventDefault(); const v = Math.max(10, Math.round(ratio)-1); setRatio(v); setRecipeRatios(prev => ({...prev, [selectedRecipeId]: v})); }}
                                        className="w-10 h-10 rounded-xl bg-neutral-100 text-neutral-600 font-bold text-xl flex items-center justify-center cursor-pointer touch-none active:scale-95"
                                    >−</button>
                                    <span className="w-14 text-center font-bold text-amber-700 text-lg tabular-nums">1:{Math.round(ratio)}</span>
                                    <button
                                        onPointerDown={(e) => { e.preventDefault(); const v = Math.min(20, Math.round(ratio)+1); setRatio(v); setRecipeRatios(prev => ({...prev, [selectedRecipeId]: v})); }}
                                        className="w-10 h-10 rounded-xl bg-neutral-100 text-neutral-600 font-bold text-xl flex items-center justify-center cursor-pointer touch-none active:scale-95"
                                    >+</button>
                                </div>
                            </div>
                        </div>

                        {/* Bean Bottom Sheet */}
                        {beanSheetOpen && (() => {
                            const displayedBeans = sheetIsExpanded ? recentBeans : recentBeans.slice(0, 5);
                            const hasMore = !sheetIsExpanded && recentBeans.length > 5;
                            return (
                            <div className="fixed inset-0 z-50 flex flex-col justify-end">
                                <div
                                    className={`absolute inset-0 bg-black/50 ${closingSheet === 'bean' ? 'backdrop-exit' : 'backdrop-enter'}`}
                                    onPointerDown={() => { closeBottomSheet('bean', setBeanSheetOpen); setAddingNewBean(false); }}
                                />
                                <div
                                    className={`relative bg-white rounded-t-3xl flex flex-col overflow-hidden sheet-panel ${sheetIsExpanded ? 'h-[90vh]' : 'h-[68vh]'} ${closingSheet === 'bean' ? 'sheet-exit' : 'sheet-enter'} ${sheetIsDragging ? 'sheet-dragging' : 'sheet-settle'}`}
                                    style={getBottomSheetStyle()}
                                >
                                    {/* Drag handle */}
                                    <div
                                        className="pt-3 pb-2 flex justify-center cursor-ns-resize shrink-0 select-none touch-none"
                                        onTouchStart={(e) => onSheetTouchStart(e, 'bean', setBeanSheetOpen)}
                                        onTouchMove={onSheetTouchMove}
                                        onTouchEnd={onSheetTouchEnd}
                                    >
                                        <div className={`w-10 h-1 rounded-full transition-colors ${sheetIsDragging ? 'bg-neutral-400' : 'bg-neutral-200'}`} />
                                    </div>
                                    {/* Header */}
                                    <div className="px-5 pb-3 flex items-center justify-between shrink-0">
                                        <p className="text-base font-bold text-neutral-800">
                                            {addingNewBean ? (isEditingBean ? '編輯咖啡豆' : '新增咖啡豆') : '選擇咖啡豆'}
                                        </p>
                                        {!addingNewBean && (
                                            <button
                                                onPointerDown={(e) => { e.preventDefault(); setAddingNewBean(true); setIsEditingBean(false); setSheetBeanName(''); setSheetRoastDate(''); setSheetRoastLevel('light'); }}
                                                className="flex items-center gap-1 text-sm text-amber-600 font-bold cursor-pointer touch-none active:opacity-60 transition-opacity"
                                            >
                                                <Plus className="w-4 h-4" /> 新豆子
                                            </button>
                                        )}
                                    </div>
                                    {/* Scrollable content */}
                                    <div className="flex-1 overflow-y-auto px-5 pb-10 space-y-2">
                                        {!addingNewBean ? (
                                            <>
                                                {recentBeans.length === 0 ? (
                                                    <p className="text-sm text-neutral-400 text-center py-6">尚無紀錄，點右上角新增咖啡豆</p>
                                                ) : displayedBeans.map(b => {
                                                    const roast = ROAST_LEVELS.find(r => r.id === b.roastLevel) || ROAST_LEVELS[0];
                                                    const isSelected = beanName === b.beanName;
                                                    return (
                                                        <div
                                                            key={b.beanName}
                                                            className={`w-full flex items-center rounded-2xl border-2 transition-all duration-150 overflow-hidden ${
                                                                isSelected ? 'border-amber-500 bg-amber-50' : 'border-neutral-100 bg-neutral-50'
                                                            }`}
                                                        >
                                                            <button
                                                                onPointerDown={(e) => {
                                                                    e.preventDefault();
                                                                    setBeanName(b.beanName);
                                                                    setRoastLevel(b.roastLevel);
                                                                    setWaterTemp(WATER_TEMPS[b.roastLevel] || 90);
                                                                    setTimeout(() => closeBottomSheet('bean', setBeanSheetOpen), 280);
                                                                }}
                                                                className="flex-1 flex items-center gap-3 px-4 py-3.5 cursor-pointer touch-none active:opacity-70 text-left"
                                                            >
                                                                <span className="text-sm font-medium text-neutral-800 flex-1">{b.beanName}</span>
                                                                <span className={`text-xs px-2 py-0.5 rounded-full border shrink-0 ${roast.color}`}>{roast.label}</span>
                                                            </button>
                                                            <button
                                                                onPointerDown={(e) => {
                                                                    e.preventDefault();
                                                                    setSheetBeanName(b.beanName);
                                                                    setSheetRoastLevel(b.roastLevel);
                                                                    setSheetRoastDate('');
                                                                    setIsEditingBean(true);
                                                                    setAddingNewBean(true);
                                                                }}
                                                                className="px-3 py-3.5 text-neutral-300 active:text-amber-500 cursor-pointer touch-none transition-colors border-l border-neutral-100"
                                                            >
                                                                <Pencil className="w-3.5 h-3.5" />
                                                            </button>
                                                        </div>
                                                    );
                                                })}
