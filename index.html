                                        onTouchStart={(e) => onSheetTouchStart(e, 'recipe', setRecipeSheetOpen)}
                                        onTouchMove={onSheetTouchMove}
                                        onTouchEnd={onSheetTouchEnd}
                                    >
                                        <div className={`w-10 h-1 rounded-full transition-colors ${sheetIsDragging ? 'bg-neutral-400' : 'bg-neutral-200'}`} />
                                    </div>
                                    <div className="px-5 pb-10">
                                        <p className="text-base font-bold text-neutral-800">切換手沖法</p>
                                        <p className="text-xs text-neutral-400 mt-1">選擇後會立即更新摘要、時間線與計時節奏</p>
                                        <div className="mt-4 space-y-2" role="radiogroup" aria-label="切換手沖法">
                                            {Object.values(RECIPES).map(option => {
                                                const optionTime = option.steps[option.steps.length - 1].endTime;
                                                const isActive = selectedRecipeId === option.id;
                                                const isRecommended = recommendedRecipeId === option.id;
                                                return (
                                                    <div
                                                        key={option.id}
                                                        className={`w-full flex items-center rounded-2xl border-2 transition-all duration-150 overflow-hidden ${
                                                            isActive ? 'border-amber-500 bg-amber-50' : 'border-neutral-100 bg-neutral-50 active:bg-neutral-100'
                                                        }`}
                                                    >
                                                        <button
                                                            type="button"
                                                            role="radio"
                                                            aria-checked={isActive}
                                                            onPointerDown={(e) => {
                                                                e.preventDefault();
                                                                if (isActive) {
                                                                    closeBottomSheet('recipe', setRecipeSheetOpen);
                                                                    return;
                                                                }
                                                                chooseRecipeAndCollapse(option.id);
                                                            }}
                                                            className="flex-1 flex items-center gap-3 px-4 py-3.5 cursor-pointer touch-none active:opacity-70 text-left"
                                                        >
                                                            <span className={`w-2 h-2 rounded-full shrink-0 ${isActive ? 'bg-amber-500' : isRecommended ? 'bg-amber-300' : 'bg-neutral-300'}`} />
                                                            <span className="flex-1 min-w-0">
                                                                <span className="flex items-center justify-between gap-3">
                                                                    <span className={`text-sm font-medium ${isActive ? 'text-amber-900' : 'text-neutral-800'}`}>
                                                                        {option.name.split('(')[0].trim()}
                                                                    </span>
                                                                </span>
                                                                <span className={`block text-xs mt-1 ${isActive ? 'text-amber-700' : 'text-neutral-500'}`}>
                                                                    {isRecommended
                                                                        ? `依你的風味偏好，推薦先從這個開始。`
                                                                        : option.description}
                                                                </span>
                                                            </span>
                                                            <span className={`text-sm font-mono font-bold shrink-0 ${isActive ? 'text-amber-700' : 'text-neutral-600'}`}>
                                                                {formatTimerDisplay(optionTime)}
                                                            </span>
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderTimerView = () => {
                const isFinished = timerStatus === 'finished';
                const totalTime = recipe.steps[recipe.steps.length-1].endTime;
                const progress = Math.min((currentTime / totalTime) * 100, 100);
                const { step, index, duration, timeInStep, targetWater } = currentStepInfo;

                const radius = 136;
                const stroke = 6;
                const normalizedRadius = radius - stroke * 2;
                const circumference = normalizedRadius * 2 * Math.PI;
                const strokeDashoffset = circumference - (progress / 100) * circumference;
                const centerContentWidth = Math.floor((normalizedRadius - 10) * Math.sqrt(2));

                return (
                    <div className="flex flex-col h-full items-center py-4 relative select-none">
                        {/* 步驟進度條 */}
                        {!isFinished && (
                            <div className="w-full px-6 mb-2 z-10">
                                {/* Row 1: 沖法 · 濾杯 / 參數 — 全壓一行 */}
                                <div className="flex items-center justify-center gap-1.5 text-[11px] mb-2.5 flex-wrap">
                                    <span className="font-semibold text-neutral-600">{recipe.name.split('(')[0].trim()}</span>
                                    <span className="text-neutral-200">·</span>
                                    <span className="text-neutral-400">{selectedDripper.name}</span>
                                    <span className="text-neutral-200 mx-0.5">/</span>
                                    <span className="font-mono text-neutral-400">{coffeeGrams}g</span>
                                    <span className="text-neutral-200">·</span>
                                    <span className="font-mono text-neutral-400">{waterTotal}ml</span>
                                    <span className="text-neutral-200">·</span>
                                    <span className="font-mono text-neutral-400">{waterTemp}°C</span>
                                    <span className="text-neutral-200">·</span>
                                    <span className="font-mono text-neutral-400">{formatTimerDisplay(totalTime)}</span>
                                </div>
                                {/* Row 2: 進度條 — 加粗 */}
                                <div className="flex gap-1 items-center mb-2">
                                    {recipe.steps.map((s, idx) => {
                                        const completed = currentTime >= s.endTime;
                                        const isCurrent = index === idx;
                                        return (
                                            <div key={idx} className={`h-2 flex-1 rounded-full transition-all duration-300 ${
                                                completed ? 'bg-amber-500' :
                                                isCurrent ? 'bg-amber-300' :
                                                'bg-neutral-200'
                                            }`} />
                                        );
                                    })}
                                </div>
                                {/* Row 3: 步驟序號 — 當前以圓點標示 */}
                                <div className="flex items-center">
                                    {recipe.steps.map((s, idx) => {
                                        const completed = currentTime >= s.endTime;
                                        const isCurrent = index === idx;
                                        return (
                                            <div key={idx} className="flex-1 flex justify-center">
                                                <span className={`text-[11px] font-mono transition-all ${
                                                    isCurrent ? 'text-amber-500 font-bold text-sm' :
                                                    completed ? 'text-amber-400' : 'text-neutral-300'
                                                }`}>{idx + 1}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 flex items-center justify-center relative w-full z-0">
                            <div className="relative">
                                <svg height={radius * 2} width={radius * 2} className="rotate-[-90deg]">
                                    <circle stroke="#e7e5e4" strokeWidth={stroke} fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                    <circle stroke="#d97706" strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 0.1s linear' }} strokeLinecap="round" fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                </svg>
                                
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6 py-6 pointer-events-none">
                                    {!isFinished ? (
                                        <div className="flex flex-col items-center space-y-1.5" style={{ width: `${centerContentWidth}px`, maxWidth: `${centerContentWidth}px` }}>
                                            <div className="w-full text-center text-[13px] font-bold leading-tight tracking-wide text-amber-600 break-words">
                                                {step.name.split('(')[0].trim()}
                                            </div>
                                            <div className="text-[42px] font-bold text-neutral-800 tabular-nums tracking-tighter leading-none">
                                                {formatTimerDisplay(currentTime)}
                                            </div>
                                            <div className="text-sm font-mono text-neutral-400">
                                                到 {formatTimerDisplay(step.endTime)}
                                            </div>
                                            <div className="flex max-w-full flex-wrap items-center justify-center gap-1.5 rounded-xl border border-amber-100 bg-amber-50 px-2.5 py-1 text-xs font-bold leading-tight text-amber-700">
                                                <Droplet className="w-3.5 h-3.5 fill-amber-700" />
                                                <span>{index > 0 ? `${getStepTargetWater(recipe.steps[index - 1], waterTotal, coffeeGrams)} → ` : ''}{targetWater} ml</span>
                                            </div>
                                            {step.desc && (
                                                <div className="w-full text-center text-[11px] leading-snug text-neutral-500 break-words">
                                                    {step.desc}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center space-y-1">
                                            <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center animate-bounce">
                                                <Coffee className="w-6 h-6" />
                                            </div>
                                            <div className="text-amber-600 font-bold text-lg">完成</div>
                                            <p className="text-neutral-400 text-xs">享受您的咖啡</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="w-full grid grid-cols-3 gap-5 items-center justify-items-center mt-auto pb-6 relative z-[999]">
                            <button onPointerDown={handleReset} disabled={timerStatus === 'idle'} aria-label="重設計時器" className="group flex flex-col items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer touch-none">
                                <div className="w-14 h-14 rounded-2xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:border-neutral-400 group-hover:text-neutral-600 shadow-sm"><RotateCcw className="w-5 h-5" /></div>
                                <span className="text-xs font-medium text-neutral-400 uppercase tracking-wider">Reset</span>
                            </button>
                            <button onPointerDown={handleStartStop} aria-label={timerStatus === 'running' ? '暫停計時器' : '開始計時器'} className={`w-24 h-24 rounded-3xl flex items-center justify-center shadow-xl shadow-amber-200/50 cursor-pointer touch-none ${timerStatus === 'running' ? 'bg-amber-100 text-amber-600 border-2 border-amber-200' : 'bg-amber-600 text-white'}`}>
                                {timerStatus === 'running' ? <Pause className="w-10 h-10 fill-current" /> : <Play className="w-10 h-10 fill-current ml-1" />}
                            </button>
                            <button onPointerDown={handleFinish} disabled={timerStatus === 'idle' || currentTime === 0} aria-label="完成並儲存沖煮" className="group flex flex-col items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer touch-none">
                                <div className="w-14 h-14 rounded-2xl bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:border-neutral-400 group-hover:text-neutral-600 shadow-sm"><Save className="w-5 h-5" /></div>
                                <span className="text-xs font-medium text-neutral-400 uppercase tracking-wider">完成</span>
                            </button>
                        </div>
                    </div>
                );
            };

            const renderJournalView = () => {
                const now = new Date();
                const filteredLogs = logs
                    .filter(log => !searchQuery || (log.beanName || '').toLowerCase().includes(searchQuery.toLowerCase()))
                    .filter(log => {
                        if (sortBy === 'week') return Date.now() - log.createdAt <= 7 * 86400000;
                        if (sortBy === 'month') { const d = new Date(log.createdAt); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }
                        return true;
                    })
                    .slice()
                    .sort((a, b) => sortBy === 'rating' ? b.rating - a.rating : sortBy === 'oldest' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);

                const monthlyCount = logs.filter(l => {
                    const d = new Date(l.createdAt);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }).length;

                const sparkData = [...logs].sort((a, b) => a.createdAt - b.createdAt).filter(l => l.rating).slice(-14);
                const SW = 130, SH = 46;
                const sy = (r) => SH - 5 - ((r - 1) / 4) * (SH - 14);
                const sx = (i) => sparkData.length < 2 ? SW / 2 : (i / (sparkData.length - 1)) * (SW - 10) + 5;
                const sparkPts = sparkData.map((l, i) => `${sx(i)},${sy(l.rating)}`).join(' ');
                const areaPts = sparkData.length > 1
                    ? [`${sx(0)},${SH}`, ...sparkData.map((l, i) => `${sx(i)},${sy(l.rating)}`), `${sx(sparkData.length-1)},${SH}`].join(' ')
                    : '';

                let trendLabel = '', trendCls = '';
                if (sparkData.length >= 4) {
                    const n = Math.min(3, Math.floor(sparkData.length / 2));
                    const recent = sparkData.slice(-n).reduce((s, l) => s + l.rating, 0) / n;
                    const earlier = sparkData.slice(0, n).reduce((s, l) => s + l.rating, 0) / n;
                    if (recent - earlier > 0.3) { trendLabel = '↑ 進步中'; trendCls = 'text-amber-600 font-bold'; }
                    else if (earlier - recent > 0.3) { trendLabel = '↓ 待加強'; trendCls = 'text-neutral-400'; }
                    else { trendLabel = '→ 穩定'; trendCls = 'text-neutral-400'; }
                }

                return (
                    <div className="space-y-4 pb-4">
                        <div className="flex items-center justify-between">
                            <h2 className="text-2xl font-bold text-neutral-800 flex items-center gap-2">
                                <BookOpen className="w-6 h-6 text-amber-600" /> 沖煮日誌
                            </h2>
                        </div>

                        {logs.length > 0 && (
                            <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden flex">
                                <div className="flex flex-col justify-center gap-4 px-5 py-4 border-r border-neutral-100 flex-shrink-0 w-[100px]">
                                    <div>
                                        <div className="text-[28px] font-bold text-neutral-800 leading-none tabular-nums">{logs.length}</div>
                                        <div className="text-xs text-neutral-400 uppercase tracking-widest mt-1">總沖煮</div>
                                    </div>
                                    <div>
                                        <div className="text-[28px] font-bold text-neutral-800 leading-none tabular-nums">{monthlyCount}</div>
                                        <div className="text-xs text-neutral-400 uppercase tracking-widest mt-1">本月</div>
                                    </div>
                                </div>
                                <div className="flex-1 px-4 py-3 flex flex-col justify-between min-w-0">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs text-neutral-400 uppercase tracking-widest">自評成長曲線</span>
                                        {trendLabel && <span className={`text-xs ${trendCls}`}>{trendLabel}</span>}
                                    </div>
                                    {sparkData.length >= 2 ? (
                                        <svg viewBox={`0 0 ${SW} ${SH}`} className="w-full mt-1" style={{overflow:'visible'}}>
                                            {areaPts && <polygon points={areaPts} fill="rgba(217,119,6,0.08)" />}
                                            <polyline points={sparkPts} fill="none" stroke="#d97706" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                                            {(() => {
                                                const last = sparkData[sparkData.length - 1];
                                                return <circle cx={sx(sparkData.length-1)} cy={sy(last.rating)} r="3" fill="#d97706" />;
                                            })()}
                                        </svg>
                                    ) : (
                                        <div className="flex-1 flex items-center justify-center">
                                            <span className="text-xs text-neutral-300">多沖幾杯後顯示</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {logs.length > 0 && (
                            <div className="flex gap-2 items-center">
                                <div className="relative flex-1 min-w-0">
                                    <label htmlFor="journal-search" className="sr-only">搜尋豆子名稱</label>
                                    <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                    <input
                                        id="journal-search"
                                        type="text"
                                        placeholder="搜尋豆子名稱..."
                                        autoComplete="off"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-9 pr-9 py-2.5 bg-white border border-neutral-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none placeholder:text-neutral-300"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} aria-label="清除搜尋" className="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-300 hover:text-neutral-500">
                                            <X className="w-4 h-4" />
                                        </button>
                                    )}
                                </div>
                                <div className="relative flex-shrink-0">
                                    <label htmlFor="journal-sort" className="sr-only">排序日誌</label>
                                    <select
                                        id="journal-sort"
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                        className="appearance-none bg-white border border-neutral-200 rounded-xl pl-3 pr-7 py-2 text-xs font-bold text-neutral-700 cursor-pointer outline-none focus:ring-2 focus:ring-amber-500"
                                    >
                                        <option value="newest">最新在前</option>
                                        <option value="oldest">最舊在前</option>
                                        <option value="month">本月</option>
                                        <option value="week">本週</option>
                                        <option value="rating">評分高低</option>
                                    </select>
                                    <ChevronDown className="absolute right-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-neutral-400 pointer-events-none" />
                                </div>
                            </div>
                        )}

                        {logs.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-neutral-200">
                                <div className="mb-3 flex justify-center"><Coffee className="w-12 h-12 text-neutral-200" /></div>
                                <p className="font-medium text-neutral-600 mb-1">還沒有紀錄</p>
                                <p className="text-sm text-neutral-400">沖完一杯後儲存，就會出現在這裡</p>
                            </div>
                        ) : filteredLogs.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-neutral-200">
                                <p className="text-neutral-400 text-sm">找不到「{searchQuery}」的紀錄</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {filteredLogs.map(log => {
                                    const roastInfo = ROAST_LEVELS.find(r => r.id === log.roastLevel) || ROAST_LEVELS[0];
                                    return (
                                        <div key={log.id} className="bg-white rounded-2xl border border-neutral-100 shadow-sm overflow-hidden cursor-pointer active:opacity-75 transition-opacity" onClick={() => handleViewLog(log)}>
                                            <div className="p-4 pb-3">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-neutral-800 text-base leading-tight truncate">
                                                            {log.beanName || '未命名咖啡豆'}
                                                        </h3>
                                                        <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                                                            <span className={`text-xs px-2 py-0.5 rounded-full border font-medium ${roastInfo.color}`}>
                                                                {roastInfo.label}
                                                            </span>
                                                            <span className="text-xs text-neutral-400">{log.dripperName || 'V60'}</span>
                                                            <span className="text-xs text-neutral-300">·</span>
                                                            <span className="text-xs text-neutral-400">{getRelativeDate(log.createdAt)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                        <div className="flex items-center gap-1 bg-amber-50 px-2.5 py-1.5 rounded-lg">
                                                            <Star className="w-3.5 h-3.5 text-amber-500 fill-current" />
                                                            <span className="text-amber-800 font-bold text-sm">{log.rating}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            {log.flowRate && (
                                                <div className="px-4 pb-3 flex gap-4">
                                                    {log.flowRate && (
                                                        <span className="inline-flex items-center gap-1.5 text-xs">
                                                            <span className={`w-1.5 h-1.5 rounded-sm flex-shrink-0 ${
                                                                log.flowRate === 'good' ? 'bg-neutral-300' :
                                                                log.flowRate === 'fast' ? 'bg-amber-400' : 'bg-neutral-700'
                                                            }`}/>
                                                            <span className={`${
                                                                log.flowRate === 'good' ? 'text-neutral-400' :
                                                                log.flowRate === 'fast' ? 'text-amber-600' : 'text-neutral-600'
                                                            }`}>流速 {FLOW_OPTIONS.find(f => f.id === log.flowRate)?.label}</span>
                                                        </span>
                                                    )}
                                                </div>
                                            )}

                                            <div className="px-4 py-2.5 bg-neutral-50 border-t border-neutral-100 flex items-center gap-3 text-xs text-neutral-400 font-mono">
                                                <span>{log.coffeeGrams}g</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{log.waterTotal}ml</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{formatTimerDisplay(log.time)}</span>
                                            </div>

                                            {log.notes && (
                                                <div className="px-4 py-2.5 border-t border-neutral-50">
                                                    <p className="text-xs text-neutral-500 italic">"{log.notes}"</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto h-[100dvh] bg-neutral-50 flex flex-col font-sans text-neutral-800 overflow-hidden">
                    <div className="bg-white px-6 py-4 shadow-sm z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                                <Coffee className="w-5 h-5 text-white" />
                            </div>
                            <span className="font-bold text-lg tracking-tight">Barista Flow</span>
                        </div>
                        <div className="text-xs font-mono text-neutral-400 cursor-help" title="資料儲存在您的裝置，不會上傳至雲端">本地模式</div>
                    </div>

                    <div ref={contentRef} className={`flex-1 scroll-smooth ${
                        (activeTab === 'brew' && timerStatus !== 'idle') ? 'overflow-hidden' :
                        (activeTab === 'brew' && brewStep === 'home')    ? 'overflow-hidden p-6' :
                        'overflow-y-auto p-6'
                    }`} style={{overscrollBehavior:'contain'}}>
                        {activeTab === 'brew' && timerStatus !== 'idle' && renderTimerView()}
                        {activeTab === 'brew' && timerStatus === 'idle' && (
                            brewStep === 'home'       ? renderHomeView() :
                            brewStep === 'config'     ? renderConfigView() :
                            renderSuggestionView()
                        )}
                        {activeTab === 'journal' && renderJournalView()}
                    </div>

                    {activeTab === 'brew' && timerStatus === 'idle' && brewStep === 'config' && (
                        <div className="px-4 pt-2 pb-2 bg-gradient-to-t from-neutral-50 via-neutral-50 to-transparent flex-shrink-0">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); setBrewStep('suggestion'); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-amber-200/50 hover:bg-amber-700 transition-all flex items-center justify-center gap-2 cursor-pointer touch-none active:scale-95"
                            >
                                查看沖煮建議 <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                    )}
                    {activeTab === 'brew' && timerStatus === 'idle' && brewStep === 'suggestion' && (
                        <div className="px-4 pt-2 pb-2 bg-gradient-to-t from-neutral-50 via-neutral-50 to-transparent flex-shrink-0">
                            <button
                                onPointerDown={(e) => { e.preventDefault(); unlockAudio(); setTimerStatus('paused'); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                className="w-full bg-amber-600 text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-amber-200/50 hover:bg-amber-700 transition-all flex items-center justify-center gap-2 cursor-pointer touch-none active:scale-95"
                            >
                                <Play className="w-5 h-5 fill-current ml-1" /> 開始沖煮
                            </button>
                        </div>
                    )}

                    <div className="bg-white border-t border-neutral-100 flex justify-around items-center pt-4 px-6 w-full flex-shrink-0" style={{ paddingBottom: 'max(24px, env(safe-area-inset-bottom))' }}>
                        <button
                            onClick={() => { setActiveTab('brew'); setBrewStep('home'); }}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'brew' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <Droplet className="w-6 h-6" />
                            <span className="text-xs font-medium">沖煮</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('journal')}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'journal' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <BookOpen className="w-6 h-6" />
                            <span className="text-xs font-medium">日誌</span>
                        </button>
                    </div>

                    {saveFeedback && (
                        <div
                            className="fixed left-1/2 bottom-24 z-[2500] -translate-x-1/2 rounded-full bg-neutral-900 px-4 py-2 text-sm font-medium text-white shadow-xl"
                            role="status"
                            aria-live="polite"
                        >
                            {saveFeedback}
                        </div>
                    )}

                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black/50 z-[2000] flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl animate-in zoom-in-95 duration-200 max-h-[85vh] overflow-y-auto">

                                {/* Header */}
                                <div className="flex items-center justify-between px-5 py-2">
                                    <div className="flex items-center gap-2">
                                        <h3 className="text-base font-bold text-neutral-800">{editingLogId ? '編輯紀錄' : '紀錄這杯'}</h3>
                                        {!editingLogId && (
                                            <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium border ${
                                                flowRate === 'fast' ? 'bg-amber-50 text-amber-600 border-amber-200' :
                                                flowRate === 'clog' ? 'bg-neutral-100 text-neutral-500 border-neutral-200' :
                                                'bg-green-50 text-green-600 border-green-100'
                                            }`}>
                                                {flowRate === 'fast' ? '流速偏快' : flowRate === 'clog' ? '疑似堵塞' : '流速正常'}
                                            </span>
                                        )}
                                    </div>
                                    <button onClick={handleCloseModalX} aria-label="關閉紀錄視窗" className="p-1.5 text-neutral-400 hover:text-neutral-600 rounded-lg hover:bg-neutral-100 transition-colors cursor-pointer">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="px-5 pb-6 space-y-4">
                                    {/* 評分 — 最重要，放最上方 */}
                                    <div className="flex flex-col items-center py-3 gap-1">
                                        <div className="flex gap-2">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    type="button"
                                                    aria-label={`評分 ${star} 星`}
                                                    aria-pressed={rating === star}
                                                    onClick={() => setRating(star)}
                                                    className={`p-1 transition-transform active:scale-110 cursor-pointer ${rating >= star ? 'text-amber-400' : 'text-neutral-200'}`}
                                                >
                                                    <Star className="w-8 h-8 fill-current" />
                                                </button>
                                            ))}
                                        </div>
                                        <span className="text-xs text-neutral-400 mt-0.5">{rating === 0 ? '點星給評分' : ['', '還要加油', '普通', '不錯喝', '很好喝', '完美！'][rating]}</span>
                                    </div>

                                    {/* 豆子 + 焙度 */}
                                    <div className="space-y-2">
                                        <div className="relative">
                                            <label htmlFor="log-bean-name" className="sr-only">咖啡豆名稱</label>
                                            <CoffeeBeanIcon className="absolute left-3 top-2.5 w-4 h-4 text-neutral-400" />
                                            <input
                                                id="log-bean-name"
                                                type="text"
                                                placeholder="咖啡豆名稱"
                                                autoComplete="off"
                                                value={beanName}
                                                onChange={(e) => setBeanName(e.target.value)}
                                                className="w-full pl-9 pr-4 py-2.5 bg-neutral-50 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                            />
                                        </div>
                                        <div className="flex gap-2" role="radiogroup" aria-label="烘焙程度">
                                            {ROAST_LEVELS.map(level => (
                                                <button
                                                    key={level.id}
                                                    type="button"
                                                    role="radio"
                                                    aria-checked={roastLevel === level.id}
                                                    onClick={() => setRoastLevel(level.id)}
                                                    className={`flex-1 py-1.5 rounded-lg text-xs font-medium border transition-all cursor-pointer ${
                                                        roastLevel === level.id
                                                        ? `${level.color} shadow-sm`
                                                        : 'bg-white text-neutral-500 border-neutral-200 hover:bg-neutral-50'
                                                    }`}
                                                >
                                                    {level.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 風味雷達 */}
                                    <div className="space-y-1">
                                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">風味雷達</p>
                                        <RadarChart
                                            data={sensory}
                                            onChange={(key, val) => setSensory(prev => ({ ...prev, [key]: val }))}
                                        />
                                        <p className="text-center text-xs text-neutral-300">往各方向拖曳調整</p>
                                    </div>

                                    {/* 備註 */}
                                    <label htmlFor="log-notes" className="sr-only">沖煮備註</label>
                                    <textarea
                                        id="log-notes"
                                        placeholder="備註（選填）"
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none h-16"
                                    />

                                    {/* 按鈕 */}
                                    <div className="flex gap-3">
                                        {editingLogId && (
                                            <button
                                                onClick={deleteLog}
                                                aria-label="刪除紀錄"
                                                className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors cursor-pointer"
                                                title="刪除紀錄"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        )}
                                        <button
                                            onClick={saveLog}
                                            className="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl shadow-lg hover:bg-amber-700 transition-colors cursor-pointer"
                                        >
                                            {editingLogId ? '更新紀錄' : '儲存紀錄'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    {viewingLog && (() => {
                        const vl = viewingLog;
                        const vlRoast = ROAST_LEVELS.find(r => r.id === vl.roastLevel) || ROAST_LEVELS[0];
                        const vlSensory = vl.sensory || { acidity: 3, sweetness: 3, bitterness: 3, body: 3 };
                        return (
                            <div className="fixed inset-0 bg-black/50 z-[2000] flex items-end justify-center backdrop-blur-sm" onClick={() => setViewingLog(null)}>
                                <div
                                    className="bg-white w-full max-w-md rounded-t-3xl shadow-2xl max-h-[88vh] overflow-y-auto"
                                    style={{ transform: `translateY(${sheetDragY}px)`, transition: sheetDragY === 0 ? 'transform 0.3s ease' : 'none' }}
                                    onClick={e => e.stopPropagation()}
                                >
                                    <div
                                        className="flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing touch-none"
                                        onTouchStart={handleSheetTouchStart}
                                        onTouchMove={handleSheetTouchMove}
                                        onTouchEnd={handleSheetTouchEnd}
                                    >
                                        <div className="w-12 h-1.5 bg-neutral-200 rounded-full" />
                                    </div>

                                    <div className="flex items-start justify-between px-5 pt-3 pb-3">
                                        <div className="flex-1 min-w-0 pr-3">
                                            <h3 className="text-xl font-bold text-neutral-800 truncate">{vl.beanName || '未命名咖啡豆'}</h3>
                                            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                                <span className={`text-xs px-2 py-0.5 rounded-full border font-medium ${vlRoast.color}`}>{vlRoast.label}</span>
                                                <span className="text-xs text-neutral-400">{vl.dripperName || 'V60'}</span>
                                                <span className="text-xs text-neutral-300">·</span>
                                                <span className="text-xs text-neutral-400">{getRelativeDate(vl.createdAt)}</span>
                                            </div>
                                        </div>
                                        <button onClick={() => setViewingLog(null)} aria-label="關閉紀錄詳情" className="p-1.5 text-neutral-400 hover:text-neutral-600 rounded-lg hover:bg-neutral-100 transition-colors cursor-pointer flex-shrink-0">
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div className="px-5 pb-8 space-y-4">
                                        <div className="flex items-center gap-1">
                                            {[1,2,3,4,5].map(star => (
                                                <Star key={star} className={`w-6 h-6 ${vl.rating >= star ? 'text-amber-400 fill-current' : 'text-neutral-200 fill-current'}`} />
                                            ))}
                                            <span className="ml-1.5 text-sm font-bold text-amber-700">{vl.rating} / 5</span>
                                        </div>

                                        <div>
                                            <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2">風味雷達</p>
                                            <RadarChart data={vlSensory} onChange={null} />
                                        </div>

                                        <div className="flex gap-2">
                                            {vl.flowRate && (
                                                <div className="flex-1 bg-neutral-50 border border-neutral-100 rounded-xl p-3 text-center">
                                                    <p className="text-xs text-neutral-400 font-medium mb-1">流速</p>
                                                    <p className="text-sm font-bold text-neutral-700">{FLOW_OPTIONS.find(f => f.id === vl.flowRate)?.label || '—'}</p>
                                                </div>
                                            )}
                                            <div className="flex-1 bg-neutral-50 border border-neutral-100 rounded-xl p-3 text-center">
                                                <p className="text-xs text-neutral-400 font-medium mb-1">時間</p>
                                                <p className="text-sm font-bold text-neutral-700 font-mono">{formatTimerDisplay(vl.time)}</p>
                                            </div>
                                        </div>

                                        <div className="bg-neutral-50 rounded-xl p-3 flex items-center justify-around text-center">
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">粉量</p>
                                                <p className="font-bold text-neutral-800 text-sm">{vl.coffeeGrams}g</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">水量</p>
                                                <p className="font-bold text-neutral-800 text-sm">{vl.waterTotal}ml</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div>
                                                <p className="text-xs text-neutral-400 mb-0.5">比例</p>
                                                <p className="font-bold text-neutral-800 text-sm">1:{Math.round(vl.ratio)}</p>
                                            </div>
                                            <div className="w-px h-8 bg-neutral-200"/>
                                            <div className="max-w-[60px]">
                                                <p className="text-xs text-neutral-400 mb-0.5">配方</p>
                                                <p className="font-bold text-neutral-800 text-xs truncate">{(vl.recipeName || '').split('(')[0].trim()}</p>
                                            </div>
                                        </div>

                                        {vl.notes && (
                                            <div className="bg-amber-50 rounded-xl p-3.5 border border-amber-100">
                                                <p className="text-sm text-amber-900 italic">"{vl.notes}"</p>
                                            </div>
                                        )}

                                        <div className="flex gap-3 pt-1">
                                            <button
                                                onClick={() => {
                                                    if (window.confirm('確定要刪除這筆紀錄嗎？')) {
                                                        const updatedLogs = logs.filter(l => l.id !== vl.id);
                                                        setLogs(updatedLogs);
                                                        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs)); } catch(e) {}
                                                        setViewingLog(null);
                                                    }
                                                }}
                                                aria-label="刪除紀錄"
                                                className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors cursor-pointer"
                                                title="刪除紀錄"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                            <button
                                                onClick={() => { setViewingLog(null); handleEditLog(vl); }}
                                                className="flex-1 py-3 bg-neutral-900 text-white font-bold rounded-xl hover:bg-neutral-800 transition-colors cursor-pointer"
                                            >
                                                編輯
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BaristaFlow />);
    </script>
</body>
</html>
