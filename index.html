<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barista Flow</title>
    
    <!-- 1. 引入 Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 設定 Import Maps -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.300.0"
        }
    }
    </script>

    <!-- 3. 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 h-screen overflow-hidden">
    <div id="root"></div>

    <!-- 4. 主要程式邏輯 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Play, Pause, RotateCcw, Coffee, Droplets, History, Settings, ChevronRight, Save, Plus, Trash2, BookOpen, Star, Bean, Timer, List, Info, Filter, ChevronDown, ChevronUp, Edit, Pencil, X } from 'lucide-react';

        // --- 音效引擎 (強化版) ---
        let audioCtx = null;

        // 初始化/解鎖音效引擎 (必須在使用者點擊時呼叫)
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
            try {
                // 確保 Context 存在
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                
                if (!audioCtx) return;

                // 再次嘗試恢復 (以防萬一)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 聲音包絡線 (避免爆音)
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

        // --- 資料常數 ---
        const DRIPPERS = [
            { id: 'v60', name: 'V60', fullName: 'Hario V60', type: 'Cone' },
            { id: 'kalita', name: 'Kalita', fullName: 'Kalita Wave', type: 'Flat' },
            { id: 'origami', name: 'Origami', fullName: 'Origami Dripper', type: 'Cone' },
            { id: 'chemex', name: 'Chemex', fullName: 'Chemex', type: 'Cone' },
            { id: 'switch', name: 'Switch', fullName: 'Hario Switch', type: 'Hybrid' },
            { id: 'bluebottle', name: 'BB', fullName: 'Blue Bottle', type: 'Flat' },
            { id: 'other', name: 'Other', fullName: '其他濾杯', type: 'Other' },
        ];

        const RECIPES = {
            v60: {
                id: 'v60',
                name: '究極 V60 (James Hoffmann)',
                description: '強調高萃取率與乾淨度，適合淺焙豆。',
                ratio: 16.7, // 60g/L standard
                steps: [
                    { name: '悶蒸 (Bloom)', desc: '濕潤粉層', endTime: 45, waterTargetPercentage: 0.2 }, 
                    { name: '第一段注水 (60%)', desc: '建立水位與高溫', endTime: 75, waterTargetPercentage: 0.6 }, 
                    { name: '第二段注水 (100%)', desc: '維持流速', endTime: 105, waterTargetPercentage: 1.0 }, 
                    { name: '攪拌與濾乾 (Draw)', desc: '輕輕搖晃濾杯', endTime: 210, waterTargetPercentage: 1.0 } 
                ]
            },
            fourSix: {
                id: 'fourSix',
                name: '4:6 法 (Tetsu Kasuya)',
                description: '前40%決定風味，後60%決定醇厚度。',
                ratio: 15, // Standard 1:15
                steps: [
                    { name: '第1注 (酸值)', desc: '決定酸質明亮度', endTime: 45, waterTargetPercentage: 0.2 },
                    { name: '第2注 (甜感)', desc: '決定甜感與平衡', endTime: 90, waterTargetPercentage: 0.4 },
                    { name: '第3注 (層次)', desc: '堆疊濃度', endTime: 135, waterTargetPercentage: 0.6 },
                    { name: '第4注 (強度)', desc: '強化醇厚度', endTime: 180, waterTargetPercentage: 0.8 },
                    { name: '第5注 (結尾)', desc: '最後調整與濾乾', endTime: 210, waterTargetPercentage: 1.0 }
                ]
            }
        };

        const SENSORY_ATTRIBUTES = [
            { key: 'acidity', label: '酸值', color: 'bg-yellow-400' },
            { key: 'sweetness', label: '甜感', color: 'bg-orange-400' },
            { key: 'bitterness', label: '苦味', color: 'bg-stone-600' },
            { key: 'body', label: '醇厚', color: 'bg-amber-700' },
        ];

        const ROAST_LEVELS = [
            { id: 'light', label: '淺焙', color: 'bg-yellow-100 text-yellow-700 border-yellow-200' },
            { id: 'medium', label: '中焙', color: 'bg-orange-100 text-orange-700 border-orange-200' },
            { id: 'dark', label: '深焙', color: 'bg-stone-200 text-stone-700 border-stone-300' },
        ];

        const getDripperIcon = (id, isActive) => {
            const strokeColor = isActive ? "#FFFFFF" : "#a8a29e";
            const strokeWidth = 1.5;

            switch (id) {
                case 'v60': 
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M3 5h18l-9 16L3 5z" /><path d="M2 5h20" /><path d="M12 21v-4" /></svg>;
                case 'kalita':
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M4 5h16l-3 12H7L4 5z" /><path d="M2 5h20" /><path d="M7 17v-4" /><path d="M17 17v-4" /><path d="M12 17v2" /></svg>;
                case 'origami':
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M3 5h18l-9 16L3 5z" /><path d="M12 5v16" /><path d="M7.5 5l2.5 11.5" /><path d="M16.5 5l-2.5 11.5" /><path d="M2 5h20" /></svg>;
                case 'chemex':
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M7 3h10l-3 8 4 10H6l4-10-3-8z" /><path d="M10 11h4" /></svg>;
                case 'switch':
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M3 5h18l-9 16L3 5z" /><path d="M2 5h20" /><path d="M16 18l2 2" /><rect x="11" y="19" width="2" height="3" /></svg>;
                case 'bluebottle':
                    return <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"><path d="M5 5h14l-2 10H7L5 5z" /><path d="M3 5h18" /><path d="M12 15v4" /></svg>;
                default:
                    return <Coffee className="w-6 h-6" color={strokeColor} strokeWidth={strokeWidth} />;
            }
        };

        const STORAGE_KEY = 'barista_flow_logs';

        const getRelativeDate = (timestamp) => {
            const days = Math.floor((Date.now() - timestamp) / 86400000);
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days} 天前`;
            if (days < 30) return `${Math.floor(days / 7)} 週前`;
            return new Date(timestamp).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
        };

        function BaristaFlow() {
            const [activeTab, setActiveTab] = useState('brew');
            
            const [selectedRecipeId, setSelectedRecipeId] = useState('v60');
            const [selectedDripperId, setSelectedDripperId] = useState('v60');
            const [coffeeGrams, setCoffeeGrams] = useState(20);
            const [ratio, setRatio] = useState(16.7);
            const [timerStatus, setTimerStatus] = useState('idle');
            const [currentTime, setCurrentTime] = useState(0);
            const [showSaveModal, setShowSaveModal] = useState(false);
            const [showSteps, setShowSteps] = useState(false); 
            
            const [logs, setLogs] = useState(() => {
                try {
                    const savedLogs = localStorage.getItem(STORAGE_KEY);
                    return savedLogs ? JSON.parse(savedLogs) : [];
                } catch (e) {
                    console.error("Failed to load logs", e);
                    return [];
                }
            });

            const [editingLogId, setEditingLogId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const [beanName, setBeanName] = useState('');
            const [roastLevel, setRoastLevel] = useState('light');
            const [rating, setRating] = useState(5);
            const [notes, setNotes] = useState('');
            const [sensory, setSensory] = useState({
                acidity: 3,
                sweetness: 3,
                bitterness: 3,
                body: 3
            });

            const prevTimeRef = useRef(0);

            const recipe = RECIPES[selectedRecipeId];
            const waterTotal = Math.round(coffeeGrams * ratio);
            const selectedDripper = DRIPPERS.find(d => d.id === selectedDripperId) || DRIPPERS[0];
            
            useEffect(() => {
                let interval = null;
                if (timerStatus === 'running') {
                    interval = setInterval(() => {
                        setCurrentTime(prev => prev + 0.1);
                    }, 100);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [timerStatus]);

            useEffect(() => {
                if (timerStatus !== 'running') return;

                const prev = prevTimeRef.current;
                const now = currentTime;
                const currentStepIndex = recipe.steps.findIndex(s => s.endTime > prev);
                const nextStepIndex = recipe.steps.findIndex(s => s.endTime > now);
                
                if (currentStepIndex !== -1 && nextStepIndex !== -1 && currentStepIndex !== nextStepIndex) {
                    playBeep(880, 'sine', 0.2);
                }
                prevTimeRef.current = now;
            }, [currentTime, timerStatus, recipe]);

            const handleStartStop = (e) => {
                if(e) e.preventDefault(); 
                unlockAudio(); // 關鍵：解鎖音效引擎
                
                if (timerStatus === 'idle') {
                    playBeep(600, 'triangle', 0.1);
                    setTimerStatus('running');
                } else if (timerStatus === 'running') {
                    setTimerStatus('paused');
                } else if (timerStatus === 'paused') {
                    setTimerStatus('running');
                }
            };

            const handleReset = (e) => {
                if(e) e.preventDefault();
                setTimerStatus('idle');
                setCurrentTime(0);
                prevTimeRef.current = 0;
            };

            const handleFinish = (e) => {
                if(e) e.preventDefault();
                setTimerStatus('finished');
                setEditingLogId(null);
                setShowSaveModal(true);
                playBeep(440, 'sine', 0.1);
                setTimeout(() => playBeep(660, 'sine', 0.3), 150);
            };

            const handleEditLog = (log) => {
                setEditingLogId(log.id);
                setBeanName(log.beanName);
                setRoastLevel(log.roastLevel);
                setRating(log.rating);
                setSensory(log.sensory || { acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
                setNotes(log.notes);
                setShowSaveModal(true);
            };

            const closeModal = () => {
                setShowSaveModal(false);
                setEditingLogId(null);
                handleReset();
                setNotes('');
                setBeanName(''); 
                setRoastLevel('light');
                setRating(5);
                setSensory({ acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
            };

            const saveLog = async () => {
                let updatedLogs;

                if (editingLogId) {
                    updatedLogs = logs.map(l => {
                        if (l.id === editingLogId) {
                            return {
                                ...l,
                                beanName: beanName || '未命名咖啡豆',
                                roastLevel,
                                rating,
                                sensory,
                                notes
                            };
                        }
                        return l;
                    });
                } else {
                    const newLog = {
                        id: Date.now().toString(),
                        recipeName: recipe.name,
                        dripperName: selectedDripper.fullName,
                        coffeeGrams,
                        waterTotal,
                        ratio,
                        time: Math.round(currentTime),
                        rating,
                        sensory,
                        beanName: beanName || '未命名咖啡豆',
                        roastLevel,
                        notes,
                        createdAt: Date.now()
                    };
                    updatedLogs = [newLog, ...logs];
                }

                setLogs(updatedLogs);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                } catch (e) {
                    console.error("Failed to save log", e);
                }

                closeModal();
                setActiveTab('journal');
            };

            const deleteLog = async () => {
                if (!editingLogId) return;
                
                if (confirm('確定要刪除這筆紀錄嗎？')) {
                    const updatedLogs = logs.filter(l => l.id !== editingLogId);
                    setLogs(updatedLogs);
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                    } catch (e) {
                        console.error("Failed to update local storage", e);
                    }
                    closeModal();
                }
            };

            const updateSensory = (key, value) => {
                setSensory(prev => ({ ...prev, [key]: value }));
            };

            const getStepInfo = (targetTime) => {
                const stepIndex = recipe.steps.findIndex(s => s.endTime >= targetTime);
                const index = stepIndex === -1 ? recipe.steps.length - 1 : stepIndex;
                const step = recipe.steps[index];
                const prevEndTime = index > 0 ? recipe.steps[index - 1].endTime : 0;
                const duration = step.endTime - prevEndTime;
                const timeInStep = targetTime - prevEndTime;
                
                return { 
                    step, 
                    index, 
                    duration, 
                    timeInStep: Math.min(Math.max(timeInStep, 0), duration),
                    targetWater: Math.round(step.waterTargetPercentage * waterTotal)
                };
            };

            const currentStepInfo = getStepInfo(currentTime);

            // --- Views ---
            const renderCalculatorView = () => (
                <div className="space-y-3 pb-32 select-none">

                    {/* ① 選配方 */}
                    <div>
                        <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-2 px-1">① 選配方</p>
                        <div className="space-y-2">
                            {Object.values(RECIPES).map(r => {
                                const isActive = selectedRecipeId === r.id;
                                const totalTime = r.steps[r.steps.length - 1].endTime;
                                const mins = Math.floor(totalTime / 60);
                                const secs = totalTime % 60;
                                return (
                                    <button
                                        key={r.id}
                                        onPointerDown={(e) => { e.preventDefault(); setSelectedRecipeId(r.id); setRatio(r.ratio); }}
                                        type="button"
                                        className={`w-full p-4 rounded-2xl text-left transition-all border cursor-pointer ${
                                            isActive
                                            ? 'bg-amber-600 border-amber-600 shadow-lg shadow-amber-100'
                                            : 'bg-white border-stone-100 hover:border-stone-200'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <div className={`font-bold text-sm ${isActive ? 'text-white' : 'text-stone-800'}`}>
                                                    {r.name.split('(')[0].trim()}
                                                </div>
                                                <div className={`text-xs mt-0.5 ${isActive ? 'text-amber-100' : 'text-stone-400'}`}>
                                                    {r.description}
                                                </div>
                                            </div>
                                            <div className={`text-right flex-shrink-0 ml-4 ${isActive ? 'text-amber-100' : 'text-stone-400'}`}>
                                                <div className={`text-sm font-mono font-bold ${isActive ? 'text-white' : 'text-stone-600'}`}>
                                                    {mins}:{secs.toString().padStart(2, '0')}
                                                </div>
                                                <div className="text-[10px]">{r.steps.length} 步驟</div>
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* ② 豆子 & 濾杯 */}
                    <div className="bg-white rounded-2xl border border-stone-100 shadow-sm p-4 space-y-3">
                        <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">② 豆子 &amp; 濾杯</p>

                        <div className="flex gap-2">
                            {ROAST_LEVELS.map(level => (
                                <button
                                    key={level.id}
                                    onPointerDown={(e) => { e.preventDefault(); setRoastLevel(level.id); }}
                                    className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold border transition-all cursor-pointer ${
                                        roastLevel === level.id
                                        ? `${level.color} shadow-sm`
                                        : 'bg-stone-50 text-stone-400 border-stone-100 hover:bg-stone-100'
                                    }`}
                                >
                                    {level.label}
                                </button>
                            ))}
                        </div>

                        <input
                            type="text"
                            placeholder="豆子名稱（選填）"
                            value={beanName}
                            onChange={(e) => setBeanName(e.target.value)}
                            className="w-full text-sm placeholder:text-stone-300 border border-stone-200 rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-amber-500 outline-none"
                        />

                        <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-hide -mx-1 px-1">
                            {DRIPPERS.map(d => {
                                const isActive = selectedDripperId === d.id;
                                return (
                                    <button
                                        key={d.id}
                                        onClick={() => setSelectedDripperId(d.id)}
                                        type="button"
                                        className={`flex-shrink-0 flex flex-col items-center justify-center w-[68px] h-[68px] rounded-xl border transition-all cursor-pointer ${
                                            isActive
                                            ? 'bg-stone-800 border-stone-800 shadow-sm'
                                            : 'bg-white border-stone-100 hover:bg-stone-50'
                                        }`}
                                    >
                                        <div className="mb-0.5 scale-90">{getDripperIcon(d.id, isActive)}</div>
                                        <span className={`text-[9px] font-bold ${isActive ? 'text-white' : 'text-stone-400'}`}>{d.name}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* ③ 調整比例 */}
                    <div className="bg-white rounded-2xl border border-stone-100 shadow-sm p-4 space-y-5">
                        <div className="flex items-center justify-between">
                            <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">③ 調整比例</p>
                            <div className="flex items-baseline gap-1">
                                <span className="text-3xl font-bold text-stone-800">{waterTotal}</span>
                                <span className="text-sm text-stone-400 font-medium">ml</span>
                            </div>
                        </div>

                        <div>
                            <div className="flex justify-between text-sm mb-2">
                                <span className="text-stone-500 font-medium flex items-center gap-1.5">
                                    <Bean className="w-3.5 h-3.5 text-amber-600" /> 粉量
                                </span>
                                <span className="font-bold text-amber-700">{coffeeGrams}g</span>
                            </div>
                            <input
                                type="range" min="10" max="40" step="1"
                                value={coffeeGrams}
                                onChange={(e) => setCoffeeGrams(Number(e.target.value))}
                                className="w-full h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-amber-600"
                            />
                            <div className="flex justify-between text-[10px] text-stone-400 mt-1 px-0.5">
                                <span>10g</span><span>40g</span>
                            </div>
                        </div>

                        <div>
                            <div className="flex justify-between text-sm mb-2">
                                <span className="text-stone-500 font-medium flex items-center gap-1.5">
                                    <Droplets className="w-3.5 h-3.5 text-amber-600" /> 粉水比
                                </span>
                                <span className="font-bold text-amber-700">1:{Math.round(ratio)}</span>
                            </div>
                            <input
                                type="range" min="10" max="20" step="1"
                                value={Math.round(ratio)}
                                onChange={(e) => setRatio(Number(e.target.value))}
                                className="w-full h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-amber-600"
                            />
                            <div className="flex justify-between text-[10px] text-stone-400 mt-1 px-0.5">
                                <span>1:10</span><span>1:20</span>
                            </div>
                        </div>
                    </div>

                    {/* 步驟預覽 */}
                    <div className="bg-white rounded-2xl border border-stone-100 shadow-sm overflow-hidden">
                        <button
                            onPointerDown={(e) => { e.preventDefault(); setShowSteps(!showSteps); }}
                            className="w-full p-4 flex justify-between items-center cursor-pointer"
                        >
                            <span className="text-sm font-bold text-stone-500 flex items-center gap-2">
                                <Timer className="w-4 h-4 text-amber-600" /> 步驟預覽
                            </span>
                            <div className="flex items-center gap-2 text-stone-400">
                                <span className="text-xs font-mono">
                                    {Math.floor(recipe.steps[recipe.steps.length-1].endTime / 60)}:
                                    {(recipe.steps[recipe.steps.length-1].endTime % 60).toString().padStart(2, '0')}
                                </span>
                                {showSteps ? <ChevronUp className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
                            </div>
                        </button>

                        {showSteps && (
                            <div className="px-4 pb-4 space-y-1 border-t border-stone-100 pt-3">
                                {recipe.steps.map((step, idx) => {
                                    const prevEndTime = idx > 0 ? recipe.steps[idx - 1].endTime : 0;
                                    const duration = step.endTime - prevEndTime;
                                    const targetWater = Math.round(step.waterTargetPercentage * waterTotal);
                                    return (
                                        <div key={idx} className="flex items-center gap-3 text-xs p-2 rounded-lg hover:bg-stone-50">
                                            <span className="w-5 h-5 flex items-center justify-center bg-stone-100 text-stone-500 rounded-full text-[9px] font-bold flex-shrink-0">{idx + 1}</span>
                                            <span className="text-stone-600 flex-1">{step.name}</span>
                                            <span className="font-mono text-stone-400">{targetWater}ml</span>
                                            <span className="font-mono text-stone-300 w-8 text-right">{duration}s</span>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-24 left-0 right-0 p-4 bg-gradient-to-t from-stone-50 via-stone-50 to-transparent pointer-events-none z-10 flex justify-center">
                        <button
                            onPointerDown={() => { unlockAudio(); setTimerStatus('paused'); }}
                            className="w-full max-w-sm bg-stone-900 text-white py-3.5 rounded-xl font-bold text-lg shadow-xl shadow-stone-200 hover:bg-stone-800 transition-all flex items-center justify-center gap-2 cursor-pointer touch-none pointer-events-auto transform active:scale-95"
                        >
                            <Droplets className="w-5 h-5" /> 準備沖煮
                        </button>
                    </div>
                </div>
            );

            const renderTimerView = () => {
                const isFinished = timerStatus === 'finished';
                const totalTime = recipe.steps[recipe.steps.length-1].endTime;
                const progress = Math.min((currentTime / totalTime) * 100, 100);
                const { step, index, duration, timeInStep, targetWater } = currentStepInfo;

                const radius = 150; 
                const stroke = 6; 
                const normalizedRadius = radius - stroke * 2;
                const circumference = normalizedRadius * 2 * Math.PI;
                const strokeDashoffset = circumference - (progress / 100) * circumference;

                return (
                    <div className="flex flex-col h-full items-center py-4 relative select-none">
                        <div className="text-center space-y-1 mb-3 z-10 w-full px-6">
                            <h2 className="text-stone-500 font-bold text-sm tracking-wider uppercase">{recipe.name}</h2>
                            <div className="flex items-center justify-center gap-2 text-stone-400 text-[10px] font-mono">
                                <span>{selectedDripper.name}</span>
                                <span>•</span>
                                <span>{coffeeGrams}g / {waterTotal}ml</span>
                            </div>
                        </div>

                        {/* 步驟進度條 */}
                        {!isFinished && (
                            <div className="w-full px-6 mb-1 z-10">
                                <div className="flex gap-1.5 items-center mb-1.5">
                                    {recipe.steps.map((s, idx) => {
                                        const completed = currentTime >= s.endTime;
                                        const isCurrent = index === idx;
                                        return (
                                            <div key={idx} className={`h-1.5 flex-1 rounded-full transition-all duration-300 ${
                                                completed ? 'bg-amber-500' :
                                                isCurrent ? 'bg-amber-300' :
                                                'bg-stone-200'
                                            }`} />
                                        );
                                    })}
                                </div>
                                <div className="flex justify-between px-0.5">
                                    {recipe.steps.map((s, idx) => {
                                        const isCurrent = index === idx;
                                        return (
                                            <span key={idx} className={`text-[9px] font-medium transition-all flex-1 text-center ${
                                                isCurrent ? 'text-amber-600' : 'text-stone-300'
                                            }`}>
                                                {idx + 1}
                                            </span>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 flex items-center justify-center relative w-full z-0">
                            <div className="relative">
                                <svg height={radius * 2} width={radius * 2} className="rotate-[-90deg]">
                                    <circle stroke="#e7e5e4" strokeWidth={stroke} fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                    <circle stroke="#d97706" strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 0.1s linear' }} strokeLinecap="round" fill="transparent" r={normalizedRadius} cx={radius} cy={radius} />
                                </svg>
                                
                                <div className="absolute inset-0 flex flex-col items-center text-center py-10 px-4 pointer-events-none">
                                    <div className="flex flex-col items-center opacity-50 mb-auto">
                                        <span className="text-[10px] tracking-widest uppercase">Total</span>
                                        <span className="text-sm font-mono font-bold tabular-nums">{Math.floor(currentTime / 60)}:{(Math.floor(currentTime) % 60).toString().padStart(2, '0')}</span>
                                    </div>
                                    
                                    {!isFinished ? (
                                        <div className="flex flex-col items-center justify-center w-full mb-auto space-y-1">
                                            <div className="text-amber-600 font-bold text-lg truncate w-full px-2 max-w-[200px]">{step.name.split('(')[0]}</div>
                                            <div className="flex items-end leading-none">
                                                <span className="text-6xl font-bold text-stone-800 tabular-nums tracking-tighter">{Math.floor(timeInStep)}</span>
                                                <span className="text-lg text-stone-400 font-medium mb-1 ml-1 w-8 text-left">/ {duration}</span>
                                            </div>
                                            <div className="mt-2 px-4 py-1.5 bg-amber-50 rounded-2xl text-base font-bold text-amber-700 border border-amber-100 flex items-center gap-2 shadow-sm">
                                                <Droplets className="w-4 h-4 fill-amber-700" />
                                                <span>目標: {targetWater}</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center mb-auto">
                                            <div className="text-amber-600 font-bold text-3xl animate-bounce">✨ 完成</div>
                                            <p className="text-stone-400 text-xs mt-2">享受您的咖啡</p>
                                        </div>
                                    )}
                                    <div className="h-4"></div>
                                </div>
                            </div>
                        </div>

                        <div className="w-full grid grid-cols-3 gap-8 items-center justify-items-center mt-auto pb-8 relative z-[999]">
                            <button onPointerDown={handleReset} disabled={timerStatus === 'idle'} className="group flex flex-col items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer touch-none">
                                <div className="w-14 h-14 rounded-2xl bg-white border border-stone-200 flex items-center justify-center text-stone-400 group-hover:border-stone-400 group-hover:text-stone-600 shadow-sm"><RotateCcw className="w-5 h-5" /></div>
                                <span className="text-[10px] font-medium text-stone-400 uppercase tracking-wider">Reset</span>
                            </button>
                            <button onPointerDown={handleStartStop} className={`w-24 h-24 rounded-3xl flex items-center justify-center shadow-xl shadow-amber-200/50 cursor-pointer touch-none ${timerStatus === 'running' ? 'bg-amber-100 text-amber-600 border-2 border-amber-200' : 'bg-amber-600 text-white'}`}>
                                {timerStatus === 'running' ? <Pause className="w-10 h-10 fill-current" /> : <Play className="w-10 h-10 fill-current ml-1" />}
                            </button>
                            <button onPointerDown={handleFinish} disabled={timerStatus === 'idle'} className="group flex flex-col items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer touch-none">
                                <div className="w-14 h-14 rounded-2xl bg-white border border-stone-200 flex items-center justify-center text-stone-400 group-hover:border-stone-400 group-hover:text-stone-600 shadow-sm"><Save className="w-5 h-5" /></div>
                                <span className="text-[10px] font-medium text-stone-400 uppercase tracking-wider">Save</span>
                            </button>
                        </div>
                    </div>
                );
            };

            const renderJournalView = () => {
                const avgRating = logs.length > 0
                    ? (logs.reduce((s, l) => s + l.rating, 0) / logs.length).toFixed(1)
                    : null;

                const mostUsedDripper = logs.length > 0
                    ? (() => {
                        const count = {};
                        logs.forEach(l => { count[l.dripperName] = (count[l.dripperName] || 0) + 1; });
                        return Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
                    })()
                    : null;

                const filteredLogs = logs.filter(log =>
                    !searchQuery || (log.beanName || '').toLowerCase().includes(searchQuery.toLowerCase())
                );

                return (
                    <div className="space-y-4 pb-4">
                        <div className="flex items-center justify-between">
                            <h2 className="text-2xl font-bold text-stone-800 flex items-center gap-2">
                                <BookOpen className="w-6 h-6 text-amber-600" /> 沖煮日誌
                            </h2>
                        </div>

                        {logs.length > 0 && (
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-white rounded-xl p-3 text-center border border-stone-100 shadow-sm">
                                    <div className="text-2xl font-bold text-stone-800">{logs.length}</div>
                                    <div className="text-[10px] text-stone-400 uppercase tracking-wide mt-0.5">紀錄</div>
                                </div>
                                <div className="bg-amber-50 rounded-xl p-3 text-center border border-amber-100 shadow-sm">
                                    <div className="text-2xl font-bold text-amber-600">{avgRating}</div>
                                    <div className="text-[10px] text-amber-400 uppercase tracking-wide mt-0.5">平均評分</div>
                                </div>
                                <div className="bg-white rounded-xl p-3 text-center border border-stone-100 shadow-sm overflow-hidden">
                                    <div className="text-sm font-bold text-stone-800 truncate">{mostUsedDripper?.split(' ')[0]}</div>
                                    <div className="text-[10px] text-stone-400 uppercase tracking-wide mt-0.5">常用濾杯</div>
                                </div>
                            </div>
                        )}

                        {logs.length > 0 && (
                            <div className="relative">
                                <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input
                                    type="text"
                                    placeholder="搜尋豆子名稱..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-9 pr-9 py-2.5 bg-white border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none placeholder:text-stone-300"
                                />
                                {searchQuery && (
                                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-300 hover:text-stone-500">
                                        <X className="w-4 h-4" />
                                    </button>
                                )}
                            </div>
                        )}

                        {logs.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-stone-200">
                                <div className="text-5xl mb-3">☕</div>
                                <p className="font-medium text-stone-600 mb-1">還沒有紀錄</p>
                                <p className="text-sm text-stone-400">沖完一杯後儲存，就會出現在這裡</p>
                            </div>
                        ) : filteredLogs.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-stone-200">
                                <p className="text-stone-400 text-sm">找不到「{searchQuery}」的紀錄</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {filteredLogs.map(log => {
                                    const roastInfo = ROAST_LEVELS.find(r => r.id === log.roastLevel) || ROAST_LEVELS[0];
                                    return (
                                        <div key={log.id} className="bg-white rounded-2xl border border-stone-100 shadow-sm overflow-hidden">
                                            <div className="p-4 pb-3">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-stone-800 text-base leading-tight truncate">
                                                            {log.beanName || '未命名咖啡豆'}
                                                        </h3>
                                                        <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                                                            <span className={`text-[10px] px-2 py-0.5 rounded-full border font-medium ${roastInfo.color}`}>
                                                                {roastInfo.label}
                                                            </span>
                                                            <span className="text-[10px] text-stone-400">{log.dripperName || 'V60'}</span>
                                                            <span className="text-[10px] text-stone-300">·</span>
                                                            <span className="text-[10px] text-stone-400">{getRelativeDate(log.createdAt)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                        <div className="flex items-center gap-1 bg-amber-50 px-2.5 py-1.5 rounded-lg">
                                                            <Star className="w-3.5 h-3.5 text-amber-500 fill-current" />
                                                            <span className="text-amber-800 font-bold text-sm">{log.rating}</span>
                                                        </div>
                                                        <button
                                                            onClick={() => handleEditLog(log)}
                                                            className="w-8 h-8 flex items-center justify-center rounded-lg bg-stone-50 hover:bg-stone-100 text-stone-400 hover:text-stone-600 transition-colors border border-stone-100"
                                                        >
                                                            <Pencil className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>

                                            {log.sensory && (
                                                <div className="px-4 pb-3 grid grid-cols-2 gap-x-4 gap-y-2">
                                                    {SENSORY_ATTRIBUTES.map(attr => (
                                                        <div key={attr.key} className="flex items-center gap-2">
                                                            <span className="text-[10px] text-stone-400 w-8 flex-shrink-0">{attr.label}</span>
                                                            <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
                                                                <div className={`h-full rounded-full ${attr.color}`} style={{ width: `${(log.sensory[attr.key] / 5) * 100}%` }} />
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            <div className="px-4 py-2.5 bg-stone-50 border-t border-stone-100 flex items-center gap-3 text-[11px] text-stone-400 font-mono">
                                                <span>{log.coffeeGrams}g</span>
                                                <span className="text-stone-200">·</span>
                                                <span>{log.waterTotal}ml</span>
                                                <span className="text-stone-200">·</span>
                                                <span>{Math.floor(log.time / 60)}:{(log.time % 60).toString().padStart(2, '0')}</span>
                                            </div>

                                            {log.notes && (
                                                <div className="px-4 py-2.5 border-t border-stone-50">
                                                    <p className="text-xs text-stone-500 italic">"{log.notes}"</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto h-screen bg-stone-50 flex flex-col font-sans text-stone-800 overflow-hidden">
                    <div className="bg-white px-6 py-4 shadow-sm z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                                <Coffee className="w-5 h-5 text-white" />
                            </div>
                            <span className="font-bold text-lg tracking-tight">Barista Flow</span>
                        </div>
                        <div className="text-xs font-mono text-stone-400">本地模式</div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 pb-24 scroll-smooth">
                        {activeTab === 'brew' && (timerStatus === 'idle' ? renderCalculatorView() : renderTimerView())}
                        {activeTab === 'journal' && renderJournalView()}
                    </div>

                    <div className="bg-white border-t border-stone-100 flex justify-around items-center pt-4 pb-8 px-6 fixed bottom-0 w-full max-w-md z-20">
                        <button 
                            onClick={() => setActiveTab('brew')}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'brew' ? 'text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}
                        >
                            <Droplets className="w-6 h-6" />
                            <span className="text-[10px] font-medium">沖煮</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('journal')}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'journal' ? 'text-amber-600' : 'text-stone-400 hover:text-stone-600'}`}
                        >
                            <History className="w-6 h-6" />
                            <span className="text-[10px] font-medium">日誌</span>
                        </button>
                    </div>

                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black/50 z-[2000] flex items-end justify-center backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-sm rounded-t-2xl shadow-2xl animate-in slide-in-from-bottom-10 max-h-[80vh] overflow-y-auto">
                                {/* Handle */}
                                <div className="flex justify-center pt-3 pb-1 flex-shrink-0">
                                    <div className="w-10 h-1 bg-stone-200 rounded-full" />
                                </div>

                                {/* Header */}
                                <div className="flex items-center justify-between px-5 py-2">
                                    <h3 className="text-base font-bold text-stone-800">{editingLogId ? '編輯紀錄' : '紀錄這杯'}</h3>
                                    <button onClick={closeModal} className="p-1.5 text-stone-400 hover:text-stone-600 rounded-lg hover:bg-stone-100 transition-colors cursor-pointer">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="px-5 pb-6 space-y-3">
                                    {/* 豆子 + 焙度 */}
                                    <div className="space-y-2">
                                        <div className="relative">
                                            <Bean className="absolute left-3 top-2.5 w-4 h-4 text-stone-400" />
                                            <input
                                                type="text"
                                                placeholder="咖啡豆名稱"
                                                value={beanName}
                                                onChange={(e) => setBeanName(e.target.value)}
                                                className="w-full pl-9 pr-4 py-2.5 bg-stone-50 rounded-xl border border-stone-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                            />
                                        </div>
                                        <div className="flex gap-2">
                                            {ROAST_LEVELS.map(level => (
                                                <button
                                                    key={level.id}
                                                    onClick={() => setRoastLevel(level.id)}
                                                    className={`flex-1 py-1.5 rounded-lg text-xs font-medium border transition-all cursor-pointer ${
                                                        roastLevel === level.id
                                                        ? `${level.color} shadow-sm`
                                                        : 'bg-white text-stone-500 border-stone-200 hover:bg-stone-50'
                                                    }`}
                                                >
                                                    {level.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 評分 — inline */}
                                    <div className="flex items-center justify-between bg-stone-50 rounded-xl px-4 py-2.5">
                                        <span className="text-sm font-medium text-stone-600">整體評分</span>
                                        <div className="flex gap-0.5">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    onClick={() => setRating(star)}
                                                    className={`text-2xl transition-transform active:scale-110 cursor-pointer ${rating >= star ? 'text-amber-400' : 'text-stone-200'}`}
                                                >
                                                    ★
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 風味感受 — 2×2 緊湊格 */}
                                    <div>
                                        <p className="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-2">風味感受</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {SENSORY_ATTRIBUTES.map(attr => (
                                                <div key={attr.key} className="bg-stone-50 rounded-xl px-3 py-2.5">
                                                    <div className="text-xs font-medium text-stone-500 mb-2">{attr.label}</div>
                                                    <div className="flex gap-1.5">
                                                        {[1, 2, 3, 4, 5].map(lvl => (
                                                            <button
                                                                key={lvl}
                                                                onClick={() => updateSensory(attr.key, lvl)}
                                                                className={`w-5 h-5 rounded-full transition-all cursor-pointer border-2 ${
                                                                    sensory[attr.key] >= lvl
                                                                    ? `${attr.color} border-transparent`
                                                                    : 'bg-white border-stone-200 hover:border-stone-300'
                                                                }`}
                                                            />
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 備註 */}
                                    <textarea
                                        placeholder="備註（選填）"
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        className="w-full p-3 bg-stone-50 rounded-xl border border-stone-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none h-16"
                                    />

                                    {/* 按鈕 */}
                                    <div className="flex gap-3">
                                        {editingLogId && (
                                            <button
                                                onClick={deleteLog}
                                                className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors cursor-pointer"
                                                title="刪除紀錄"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        )}
                                        <button
                                            onClick={saveLog}
                                            className="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl shadow-lg hover:bg-amber-700 transition-colors cursor-pointer"
                                        >
                                            {editingLogId ? '更新紀錄' : '儲存紀錄'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BaristaFlow />);
    </script>
</body>
</html>
