        // --- 音效引擎 (強化版) ---
        let audioCtx = null;

        // 初始化/解鎖音效引擎 (必須在使用者點擊時呼叫)
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        const playBeep = (freq = 440, type = 'sine', duration = 0.1) => {
            try {
                // 確保 Context 存在
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                
                if (!audioCtx) return;

                // 再次嘗試恢復 (以防萬一)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 聲音包絡線 (避免爆音)
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio play failed", e);
            }
        };

        const STORAGE_KEY = 'barista_flow_logs';

        const getRelativeDate = (timestamp) => {
            const days = Math.floor((Date.now() - timestamp) / 86400000);
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days} 天前`;
            if (days < 30) return `${Math.floor(days / 7)} 週前`;
            return new Date(timestamp).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
        };

        function RadarChart({ data, onChange }) {
            const cx = 100, cy = 100, maxR = 68;
            const svgRef = useRef(null);
            const draggingRef = useRef(null);

            const axes = [
                { key: 'acidity',    label: '酸值', angle: -Math.PI / 2 },
                { key: 'sweetness',  label: '甜感', angle: 0 },
                { key: 'bitterness', label: '苦味', angle: Math.PI / 2 },
                { key: 'body',       label: '醇厚', angle: Math.PI },
            ];

            const pt = (angle, r) => ({
                x: +(cx + r * Math.cos(angle)).toFixed(1),
                y: +(cy + r * Math.sin(angle)).toFixed(1),
            });

            const gridPath = (r) => {
                const pts = axes.map(a => pt(a.angle, r));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            };

            const dataPath = (() => {
                const pts = axes.map(a => pt(a.angle, (data[a.key] / 5) * maxR));
                return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';
            })();

            const getSvgXY = (e) => {
                const svg = svgRef.current;
                if (!svg) return null;
                const rect = svg.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return {
                    x: ((src.clientX - rect.left) / rect.width) * 200,
                    y: ((src.clientY - rect.top) / rect.height) * 200,
                };
            };

            const nearestAxis = (dx, dy) => {
                const angle = Math.atan2(dy, dx);
                let best = axes[0], minD = Infinity;
                axes.forEach(a => {
                    let d = Math.abs(angle - a.angle);
                    if (d > Math.PI) d = 2 * Math.PI - d;
                    if (d < minD) { minD = d; best = a; }
                });
                return best;
            };

            const projValue = (dx, dy, axis) => {
                const proj = dx * Math.cos(axis.angle) + dy * Math.sin(axis.angle);
                return Math.max(1, Math.min(5, Math.round((proj / maxR) * 5)));
            };

            const onDown = (e) => {
                if (!onChange) return;
                e.preventDefault();
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                const axis = nearestAxis(dx, dy);
                draggingRef.current = axis;
                onChange(axis.key, projValue(dx, dy, axis));
            };

            const onMove = (e) => {
                if (!onChange || !draggingRef.current) return;
                e.preventDefault();
                const pos = getSvgXY(e);
                if (!pos) return;
                const dx = pos.x - cx, dy = pos.y - cy;
                onChange(draggingRef.current.key, projValue(dx, dy, draggingRef.current));
            };

            const onUp = () => { draggingRef.current = null; };

            return (
                <svg
                    ref={svgRef}
                    viewBox="0 0 200 200"
                    style={{ width: '100%', maxWidth: '200px', display: 'block', margin: '0 auto', touchAction: 'none', cursor: onChange ? 'crosshair' : 'default' }}
                    onPointerDown={onDown}
                    onPointerMove={onMove}
                    onPointerUp={onUp}
                    onPointerLeave={onUp}
                >
                    {[1,2,3,4,5].map(l => (
                        <path key={l} d={gridPath((l/5)*maxR)} fill="none" stroke={l===5?"#d1d5db":"#e5e7eb"} strokeWidth={l===5?1.5:1} />
                    ))}
                    {axes.map(a => {
                        const end = pt(a.angle, maxR);
                        return <line key={a.key} x1={cx} y1={cy} x2={end.x} y2={end.y} stroke="#d1d5db" strokeWidth="1" />;
                    })}
                    <path d={dataPath} fill="rgba(217,119,6,0.18)" stroke="#d97706" strokeWidth="2" strokeLinejoin="round" />
                    {axes.map(a => {
                        const p = pt(a.angle, (data[a.key] / 5) * maxR);
                        return <circle key={a.key} cx={p.x} cy={p.y} r="5" fill="#d97706" stroke="white" strokeWidth="2" style={{ pointerEvents: 'none' }} />;
                    })}
                    {axes.map(a => {
                        const lp = pt(a.angle, maxR + 20);
                        return (
                            <text key={a.key} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="central" style={{ pointerEvents: 'none', userSelect: 'none' }}>
                                <tspan fontSize="10" fill="#78716c" fontWeight="bold">{a.label} </tspan>
                                <tspan fontSize="10" fill="#d97706" fontWeight="bold">{data[a.key]}</tspan>
                            </text>
                        );
                    })}
                </svg>
            );
        }

        function BaristaFlow() {
            const [activeTab, setActiveTab] = useState('brew');
            
            const [selectedRecipeId, setSelectedRecipeId] = useState('v60');
            const [selectedDripperId, setSelectedDripperId] = useState('v60');
            const [coffeeGrams, setCoffeeGrams] = useState(20);
            const [ratio, setRatio] = useState(16.7);
            const [recipeRatios, setRecipeRatios] = useState({ v60: 16.7, fourSix: 15 });
            const [timerStatus, setTimerStatus] = useState('idle');
            const [currentTime, setCurrentTime] = useState(0);
            const [showSaveModal, setShowSaveModal] = useState(false);
            const [showSteps, setShowSteps] = useState(false); 
            
            const [logs, setLogs] = useState(() => {
                try {
                    const savedLogs = localStorage.getItem(STORAGE_KEY);
                    return savedLogs ? JSON.parse(savedLogs) : [];
                } catch (e) {
                    console.error("Failed to load logs", e);
                    return [];
                }
            });

            const [editingLogId, setEditingLogId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [sortOrder, setSortOrder] = useState('date');
            const [flowRate, setFlowRate] = useState('good');
            const [stability, setStability] = useState('stable');

            const [beanName, setBeanName] = useState('');
            const [roastLevel, setRoastLevel] = useState('light');
            const [rating, setRating] = useState(5);
            const [notes, setNotes] = useState('');
            const [sensory, setSensory] = useState({
                acidity: 3,
                sweetness: 3,
                bitterness: 3,
                body: 3
            });

            const prevTimeRef = useRef(0);

            const recipe = RECIPES[selectedRecipeId];
            const waterTotal = Math.round(coffeeGrams * ratio);
            const selectedDripper = DRIPPERS.find(d => d.id === selectedDripperId) || DRIPPERS[0];
            
            useEffect(() => {
                let interval = null;
                if (timerStatus === 'running') {
                    interval = setInterval(() => {
                        setCurrentTime(prev => prev + 0.1);
                    }, 100);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [timerStatus]);

            useEffect(() => {
                if (timerStatus !== 'running') return;

                const prev = prevTimeRef.current;
                const now = currentTime;
                const currentStepIndex = recipe.steps.findIndex(s => s.endTime > prev);
                const nextStepIndex = recipe.steps.findIndex(s => s.endTime > now);
                
                if (currentStepIndex !== -1 && nextStepIndex !== -1 && currentStepIndex !== nextStepIndex) {
                    playBeep(880, 'sine', 0.2);
                }
                prevTimeRef.current = now;
            }, [currentTime, timerStatus, recipe]);

            const handleStartStop = (e) => {
                if(e) e.preventDefault(); 
                unlockAudio(); // 關鍵：解鎖音效引擎
                
                if (timerStatus === 'idle') {
                    playBeep(600, 'triangle', 0.1);
                    setTimerStatus('running');
                } else if (timerStatus === 'running') {
                    setTimerStatus('paused');
                } else if (timerStatus === 'paused') {
                    setTimerStatus('running');
                }
            };

            const handleReset = (e) => {
                if(e) e.preventDefault();
                if (timerStatus === 'idle') return;
                setTimerStatus('idle');
                setCurrentTime(0);
                prevTimeRef.current = 0;
            };

            const handleFinish = (e) => {
                if(e) e.preventDefault();
                setTimerStatus('finished');
                setEditingLogId(null);
                setShowSaveModal(true);
                playBeep(440, 'sine', 0.1);
                setTimeout(() => playBeep(660, 'sine', 0.3), 150);
            };

            const handleEditLog = (log) => {
                setEditingLogId(log.id);
                setBeanName(log.beanName);
                setRoastLevel(log.roastLevel);
                setRating(log.rating);
                setSensory(log.sensory || { acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
                setFlowRate(log.flowRate || 'good');
                setStability(log.stability || 'stable');
                setNotes(log.notes);
                setShowSaveModal(true);
            };

            const closeModal = () => {
                setShowSaveModal(false);
                setEditingLogId(null);
                handleReset();
                setNotes('');
                setBeanName(''); 
                setRoastLevel('light');
                setRating(5);
                setSensory({ acidity: 3, sweetness: 3, bitterness: 3, body: 3 });
                setFlowRate('good');
                setStability('stable');
            };

            const saveLog = async () => {
                let updatedLogs;

                if (editingLogId) {
                    updatedLogs = logs.map(l => {
                        if (l.id === editingLogId) {
                            return {
                                ...l,
                                beanName: beanName || '未命名咖啡豆',
                                roastLevel,
                                rating,
                                sensory,
                                flowRate,
                                stability,
                                notes
                            };
                        }
                        return l;
                    });
                } else {
                    const newLog = {
                        id: Date.now().toString(),
                        recipeName: recipe.name,
                        dripperName: selectedDripper.fullName,
                        coffeeGrams,
                        waterTotal,
                        ratio,
                        time: Math.round(currentTime),
                        rating,
                        sensory,
                        flowRate,
                        stability,
                        beanName: beanName || '未命名咖啡豆',
                        roastLevel,
                        notes,
                        createdAt: Date.now()
                    };
                    updatedLogs = [newLog, ...logs];
                }

                setLogs(updatedLogs);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                } catch (e) {
                    console.error("Failed to save log", e);
                }

                closeModal();
                setActiveTab('journal');
            };

            const deleteLog = async () => {
                if (!editingLogId) return;
                
                if (confirm('確定要刪除這筆紀錄嗎？')) {
                    const updatedLogs = logs.filter(l => l.id !== editingLogId);
                    setLogs(updatedLogs);
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedLogs));
                    } catch (e) {
                        console.error("Failed to update local storage", e);
                    }
                    closeModal();
                }
            };

            const updateSensory = (key, value) => {
                setSensory(prev => ({ ...prev, [key]: value }));
            };

            const getStepInfo = (targetTime) => {
                const stepIndex = recipe.steps.findIndex(s => s.endTime >= targetTime);
                const index = stepIndex === -1 ? recipe.steps.length - 1 : stepIndex;
                const step = recipe.steps[index];
                const prevEndTime = index > 0 ? recipe.steps[index - 1].endTime : 0;
                const duration = step.endTime - prevEndTime;
                const timeInStep = targetTime - prevEndTime;
                
                return { 
                    step, 
                    index, 
                    duration, 
                    timeInStep: Math.min(Math.max(timeInStep, 0), duration),
                    targetWater: Math.round(step.waterTargetPercentage * waterTotal)
                };
            };

            const currentStepInfo = getStepInfo(currentTime);

            // --- Views ---
            const renderCalculatorView = () => (
                <div className="space-y-3 pb-32 select-none">

                    {/* ① 選配方 */}
                    <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm p-4 space-y-2">
                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">① 選配方</p>
                        <div className="flex gap-2">
                            {Object.values(RECIPES).map(r => {
                                const isActive = selectedRecipeId === r.id;
                                return (
                                    <button
                                        key={r.id}
                                        onPointerDown={(e) => { e.preventDefault(); setSelectedRecipeId(r.id); setRatio(recipeRatios[r.id] ?? r.ratio); }}
                                        type="button"
                                        className={`flex-1 py-2.5 rounded-xl text-sm font-bold border transition-all cursor-pointer ${
                                            isActive
                                            ? 'bg-neutral-900 text-white border-neutral-900'
                                            : 'bg-neutral-50 text-neutral-500 border-neutral-100 hover:border-neutral-300'
                                        }`}
                                    >
                                        {r.name.split('(')[0].trim()}
                                    </button>
                                );
                            })}
                        </div>
                        <p className="text-xs text-neutral-400 px-0.5">{recipe.description}</p>
                    </div>

                    {/* ② 豆子 & 濾杯 */}
                    <div className="bg-white rounded-2xl border border-neutral-100 shadow-sm p-4 space-y-3">
                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">② 豆子 &amp; 濾杯</p>

                        <div className="flex items-center gap-2">
                            <div className="flex bg-neutral-100 rounded-xl p-1 flex-shrink-0">
                                {ROAST_LEVELS.map(level => (
                                    <button
                                        key={level.id}
                                        onPointerDown={(e) => { e.preventDefault(); setRoastLevel(level.id); }}
                                        className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                                            roastLevel === level.id
                                            ? level.id === 'dark'
                                                ? 'bg-neutral-900 text-white shadow-sm'
                                                : level.id === 'medium'
                                                    ? 'bg-white text-neutral-700 shadow-sm'
                                                    : 'bg-white text-neutral-500 shadow-sm'
                                            : 'text-neutral-400 hover:text-neutral-500'

                                                    {log.stability && (
                                                        <span className="inline-flex items-center gap-1.5 text-xs">
                                                            <span className={`w-1.5 h-1.5 rounded-sm flex-shrink-0 ${
                                                                log.stability === 'stable' ? 'bg-neutral-300' :
                                                                log.stability === 'shaky'  ? 'bg-amber-400' : 'bg-neutral-700'
                                                            }`}/>
                                                            <span className={`${
                                                                log.stability === 'stable' ? 'text-neutral-400' :
                                                                log.stability === 'shaky'  ? 'text-amber-600' : 'text-neutral-600'
                                                            }`}>注水 {STABILITY_OPTIONS.find(s => s.id === log.stability)?.label}</span>
                                                        </span>
                                                    )}
                                                </div>
                                            )}

                                            <div className="px-4 py-2.5 bg-neutral-50 border-t border-neutral-100 flex items-center gap-3 text-xs text-neutral-400 font-mono">
                                                <span>{log.coffeeGrams}g</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{log.waterTotal}ml</span>
                                                <span className="text-neutral-200">·</span>
                                                <span>{Math.floor(log.time / 60)}:{(log.time % 60).toString().padStart(2, '0')}</span>
                                            </div>

                                            {log.notes && (
                                                <div className="px-4 py-2.5 border-t border-neutral-50">
                                                    <p className="text-xs text-neutral-500 italic">"{log.notes}"</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto h-screen bg-neutral-50 flex flex-col font-sans text-neutral-800 overflow-hidden">
                    <div className="bg-white px-6 py-4 shadow-sm z-10 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                                <Coffee className="w-5 h-5 text-white" />
                            </div>
                            <span className="font-bold text-lg tracking-tight">Barista Flow</span>
                        </div>
                        <div className="text-xs font-mono text-neutral-400 cursor-help" title="資料儲存在您的裝置，不會上傳至雲端">本地模式</div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 pb-24 scroll-smooth" style={{overscrollBehavior:'contain'}}>
                        {activeTab === 'brew' && (timerStatus === 'idle' ? renderCalculatorView() : renderTimerView())}
                        {activeTab === 'journal' && renderJournalView()}
                    </div>

                    <div className="bg-white border-t border-neutral-100 flex justify-around items-center pt-4 pb-8 px-6 fixed bottom-0 w-full max-w-md z-20">
                        <button 
                            onClick={() => setActiveTab('brew')}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'brew' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <Droplets className="w-6 h-6" />
                            <span className="text-xs font-medium">沖煮</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('journal')}
                            className={`flex flex-col items-center gap-1 transition-colors cursor-pointer ${activeTab === 'journal' ? 'text-amber-600' : 'text-neutral-400 hover:text-neutral-600'}`}
                        >
                            <BookOpen className="w-6 h-6" />
                            <span className="text-xs font-medium">日誌</span>
                        </button>
                    </div>

                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black/50 z-[2000] flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl animate-in zoom-in-95 duration-200 max-h-[85vh] overflow-y-auto">

                                {/* Header */}
                                <div className="flex items-center justify-between px-5 py-2">
                                    <h3 className="text-base font-bold text-neutral-800">{editingLogId ? '編輯紀錄' : '紀錄這杯'}</h3>
                                    <button onClick={closeModal} className="p-1.5 text-neutral-400 hover:text-neutral-600 rounded-lg hover:bg-neutral-100 transition-colors cursor-pointer">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="px-5 pb-6 space-y-3">
                                    {/* 豆子 + 焙度 */}
                                    <div className="space-y-2">
                                        <div className="relative">
                                            <Bean className="absolute left-3 top-2.5 w-4 h-4 text-neutral-400" />
                                            <input
                                                type="text"
                                                placeholder="咖啡豆名稱"
                                                value={beanName}
                                                onChange={(e) => setBeanName(e.target.value)}
                                                className="w-full pl-9 pr-4 py-2.5 bg-neutral-50 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                            />
                                        </div>
                                        <div className="flex gap-2">
                                            {ROAST_LEVELS.map(level => (
                                                <button
                                                    key={level.id}
                                                    onClick={() => setRoastLevel(level.id)}
                                                    className={`flex-1 py-1.5 rounded-lg text-xs font-medium border transition-all cursor-pointer ${
                                                        roastLevel === level.id
                                                        ? `${level.color} shadow-sm`
                                                        : 'bg-white text-neutral-500 border-neutral-200 hover:bg-neutral-50'
                                                    }`}
                                                >
                                                    {level.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 評分 — inline */}
                                    <div className="flex items-center justify-between bg-neutral-50 rounded-xl px-4 py-2.5">
                                        <span className="text-sm font-medium text-neutral-600">整體評分</span>
                                        <div className="flex gap-0.5">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    onClick={() => setRating(star)}
                                                    className={`text-2xl transition-transform active:scale-110 cursor-pointer ${rating >= star ? 'text-amber-400' : 'text-neutral-200'}`}
                                                >
                                                    ★
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 風味雷達 */}
                                    <div className="space-y-1">
                                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">風味雷達</p>
                                        <RadarChart
                                            data={sensory}
                                            onChange={(key, val) => setSensory(prev => ({ ...prev, [key]: val }))}
                                        />
                                        <p className="text-center text-xs text-neutral-300">往各方向拖曳調整</p>
                                    </div>

                                    {/* 3 快選：流速 & 穩定度 */}
                                    <div className="space-y-2">
                                        <p className="text-xs font-bold text-neutral-400 uppercase tracking-widest">這杯狀況</p>
                                        <div>
                                            <p className="text-xs text-neutral-500 mb-1.5">流速</p>
                                            <div className="flex gap-2">
                                                {FLOW_OPTIONS.map(opt => (
                                                    <button key={opt.id} onClick={() => setFlowRate(opt.id)}
                                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all cursor-pointer ${
                                                            flowRate === opt.id ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-neutral-50 text-neutral-500 border-neutral-100 hover:bg-neutral-100'
                                                        }`}>{opt.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <p className="text-xs text-neutral-500 mb-1.5">注水穩定</p>
                                            <div className="flex gap-2">
                                                {STABILITY_OPTIONS.map(opt => (
                                                    <button key={opt.id} onClick={() => setStability(opt.id)}
                                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all cursor-pointer ${
                                                            stability === opt.id ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-neutral-50 text-neutral-500 border-neutral-100 hover:bg-neutral-100'
                                                        }`}>{opt.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 備註 */}
                                    <textarea
                                        placeholder="備註（選填）"
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        className="w-full p-3 bg-neutral-50 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none h-16"
                                    />

                                    {/* 按鈕 */}
                                    <div className="flex gap-3">
                                        {editingLogId && (
                                            <button
                                                onClick={deleteLog}
                                                className="flex-none p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition-colors cursor-pointer"
                                                title="刪除紀錄"
                                            >
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        )}
                                        <button
                                            onClick={saveLog}
                                            className="flex-1 py-3 bg-amber-600 text-white font-bold rounded-xl shadow-lg hover:bg-amber-700 transition-colors cursor-pointer"
                                        >
                                            {editingLogId ? '更新紀錄' : '儲存紀錄'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<BaristaFlow />);
    </script>
</body>
</html>
