<!DOCTYPE html>

<html class="light" lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-dot-active { width: 16px; height: 6px; border-radius: 99px; }
        .step-dot-inactive { width: 6px; height: 6px; border-radius: 99px; }
        .timeline-rail { position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#ffc329",
                        "tertiary-container": "#00873b",
                        "surface-container": "#f0eded",
                        "on-secondary-fixed": "#261a00",
                        "on-tertiary-container": "#f7fff3",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#f9bd22",
                        "surface-tint": "#904d00",
                        "surface-container-highest": "#e5e2e1",
                        "surface-amber": "#fef3c7",
                        "surface-container-high": "#eae7e7",
                        "tertiary-fixed-dim": "#4ae176",
                        "on-tertiary-fixed-variant": "#005321",
                        "on-secondary-fixed-variant": "#5c4300",
                        "on-primary-fixed": "#2f1500",
                        "secondary": "#795900",
                        "surface-filter": "#fafafa",
                        "surface-cream": "#fff7ed",
                        "tertiary": "#006b2d",
                        "primary": "#8d4b00",
                        "surface-variant": "#e5e2e1",
                        "error": "#ba1a1a",
                        "text-steam": "#525252",
                        "inverse-on-surface": "#f3f0ef",
                        "on-primary-container": "#fffbff",
                        "surface": "#fcf9f8",
                        "secondary-fixed": "#ffdf9f",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#6bff8f",
                        "text-ghost": "#a3a3a3",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf9f8",
                        "outline": "#887364",
                        "on-tertiary-fixed": "#002109",
                        "surface-dim": "#dcd9d9",
                        "on-secondary-container": "#6f5100",
                        "inverse-primary": "#ffb77d",
                        "on-surface-variant": "#554336",
                        "on-primary-fixed-variant": "#6e3900",
                        "primary-fixed-dim": "#ffb77d",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-background": "#1c1b1b",
                        "surface-bright": "#fcf9f8",
                        "surface-container-low": "#f6f3f2",
                        "primary-fixed": "#ffdcc3",
                        "outline-variant": "#dbc2b0",
                        "on-surface": "#1c1b1b",
                        "error-heat": "#ef4444",
                        "inverse-surface": "#313030",
                        "primary-container": "#b15f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gap-xs": "4px",
                        "gap-sm": "8px",
                        "touch-target": "44px",
                        "margin-wide": "24px",
                        "base": "4px",
                        "margin-standard": "20px",
                        "gap-md": "12px"
                    },
                    "fontFamily": {
                        "card-title": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "mono-data": ["JetBrains Mono"],
                        "caption": ["Hanken Grotesk"],
                        "body-medium": ["Hanken Grotesk"],
                        "timer-display": ["JetBrains Mono"],
                        "subhead-hero": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "card-title": ["16px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "mono-data": ["14px", {"lineHeight": "1", "fontWeight": "700"}],
                        "caption": ["11px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "body-medium": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "timer-display": ["42px", {"lineHeight": "1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "subhead-hero": ["18px", {"lineHeight": "1.1", "fontWeight": "900"}],
                        "headline-lg": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-medium min-h-screen pb-32">
<!-- Header Navigation -->
<header class="w-full top-0 sticky bg-background z-40 px-margin-standard h-touch-target flex items-center justify-between max-w-[430px] mx-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="font-card-title text-card-title">確認沖煮方式</h1>
<div class="flex items-center gap-1.5">
<div class="step-dot-inactive bg-outline-variant"></div>
<div class="step-dot-active bg-primary"></div>
</div>
</header>
<main class="max-w-[430px] mx-auto px-margin-standard space-y-gap-md mt-4">
<!-- Recipe Context Row -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-black/[0.06] flex items-center justify-between">
<div class="flex items-center gap-gap-sm">
<div class="flex items-center gap-1 cursor-pointer">
<span class="font-bold text-on-surface">究極 V60</span>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="expand_more">expand_more</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-surface-amber text-primary text-caption font-bold">建議</span>
<span class="text-outline-variant">•</span>
<span class="text-on-surface-variant text-caption">衣索比亞 水洗</span>
</div>
<span class="font-mono-data text-mono-data text-primary">1:15</span>
</div>
<!-- Prep Checklist Card -->
<section class="bg-surface-container-lowest rounded-[24px] p-5 shadow-sm border border-black/[0.06] space-y-4">
<h2 class="font-card-title text-card-title flex items-center gap-2">
<span class="w-1.5 h-4 bg-primary rounded-full"></span>
                準備清單
            </h2>
<div class="space-y-3">
<!-- Grinding -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/50">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-tertiary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="settings">settings</span>
</div>
<div>
<p class="text-caption text-text-ghost">研磨</p>
<p class="font-bold text-on-surface-variant">C40 · 24 格</p>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-tertiary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]" data-icon="check">check</span>
</div>
</div>
<!-- Weighing -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/50">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-surface-amber flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="coffee_bean" style="font-variation-settings: 'FILL' 1;">coffee</span>
</div>
<div>
<p class="text-caption text-text-ghost">秤豆</p>
<div class="flex items-center gap-2">
<p class="font-bold text-on-surface">20 g</p>
<span class="material-symbols-outlined text-outline-variant text-[16px] cursor-pointer" data-icon="edit">edit</span>
</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Water Heating -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/50">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-surface-amber flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="water_drop" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<div>
<p class="text-caption text-text-ghost">燒水</p>
<div class="flex items-center gap-2">
<p class="font-bold text-on-surface">300 ml · 90°C</p>
<span class="material-symbols-outlined text-outline-variant text-[16px] cursor-pointer" data-icon="edit">edit</span>
</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</div>
<!-- Estimated Time -->
<div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/50 border border-transparent">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="timer">timer</span>
</div>
<div>
<p class="text-caption text-text-ghost">預計時間</p>
<p class="font-bold text-on-surface">03:00</p>
</div>
</div>
</div>
</div>
<!-- Inline Adjustment -->
<button class="w-full py-2 flex items-center justify-center gap-2 text-caption text-on-surface-variant font-bold border-t border-outline-variant/10 mt-2 active:opacity-60 transition-opacity">
                粉量 / 水溫 / 烘焙度 調整
                <span class="material-symbols-outlined text-[16px]" data-icon="expand_more">expand_more</span>
</button>
</section>
<!-- Pour Timeline Card -->
<section class="bg-surface-container-lowest rounded-[24px] p-5 shadow-sm border border-black/[0.06] space-y-6">
<h2 class="font-card-title text-card-title flex items-center gap-2">
<span class="w-1.5 h-4 bg-primary rounded-full"></span>
                注水時間線 · 4段
            </h2>
<div class="relative space-y-8 pl-1">
<!-- Timeline Rail -->
<div class="timeline-rail bg-surface-container-high"></div>
<!-- Node 1 -->
<div class="relative flex items-center justify-between">
<div class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-[11px] font-bold text-white z-10 border-4 border-surface-container-lowest">1</div>
<div>
<p class="font-bold text-on-surface leading-tight">悶蒸</p>
<span class="inline-block mt-1 px-2 py-0.5 rounded bg-surface-amber text-primary text-[11px] font-black">+40ml</span>
</div>
</div>
<span class="font-mono-data text-mono-data text-primary">00:45</span>
</div>
<!-- Node 2 -->
<div class="relative flex items-center justify-between">
<div class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-[11px] font-bold text-white z-10 border-4 border-surface-container-lowest">2</div>
<div>
<p class="font-bold text-on-surface leading-tight">主注水</p>
<span class="inline-block mt-1 px-2 py-0.5 rounded bg-surface-amber text-primary text-[11px] font-black">+140ml</span>
</div>
</div>
<span class="font-mono-data text-mono-data text-primary">01:15</span>
</div>
<!-- Node 3 -->
<div class="relative flex items-center justify-between">
<div class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-[11px] font-bold text-white z-10 border-4 border-surface-container-lowest">3</div>
<div>
<p class="font-bold text-on-surface leading-tight">補足總水量</p>
<span class="inline-block mt-1 px-2 py-0.5 rounded bg-surface-amber text-primary text-[11px] font-black">+120ml</span>
</div>
</div>
<span class="font-mono-data text-mono-data text-primary">01:45</span>
</div>
<!-- Node 4 -->
<div class="relative flex items-center justify-between">
<div class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-[11px] font-bold text-on-surface-variant z-10 border-4 border-surface-container-lowest">4</div>
<div>
<p class="font-bold text-on-surface-variant leading-tight">攪拌與濾乾</p>
</div>
</div>
<span class="font-mono-data text-mono-data text-on-surface-variant">03:00</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Button -->
<footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] p-margin-standard bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full h-14 bg-primary text-white rounded-2xl flex items-center justify-center gap-3 font-bold text-lg shadow-[0_8px_20px_-4px_rgba(141,75,0,0.4)] active:scale-[0.98] transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            開始沖煮
        </button>
</footer>
<script>
        // Simple micro-interaction for checkboxes
        document.querySelectorAll('.rounded-full.border-2').forEach(checkbox => {
            checkbox.addEventListener('click', function() {
                this.classList.toggle('bg-tertiary');
                this.classList.toggle('border-outline-variant');
                this.classList.toggle('border-tertiary');
                if(this.classList.contains('bg-tertiary')) {
                    this.innerHTML = '<span class="material-symbols-outlined text-white text-[18px]" data-icon="check">check</span>';
                } else {
                    this.innerHTML = '';
                }
            });
        });
    </script>
</body></html>
